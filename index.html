  --p1:#3a6b55; --p2:#6f7a37; --p3:#9c3d26; --p4:#7a4a34; --p5:#3c4e6b;

}
/* Moon — the cool near-black night palette; moonlight silver/steel-blue, blackletter title */
:root[data-theme="moon"]{
  --bg:#0a0c10; --panel:#13161c; --panel2:#1b1f27; --ink:#dfe6ee; --ink2:#aab4c0; --mute:#78828f; --rule:#262c36;
  --rust:#7fa6c9; --gold:#b9c2cf; --wire:#333a46; --str:#cdd4dd; --onacc:#0a0c10; --dark:#000; --ondark:#dfe6ee;
  --p1:#6e93a8; --p2:#7f9a86; --p3:#9a8fb0; --p4:#8a97ab; --p5:#6477a0;
  --teal:#6e93a8; --sage:#7f9a86; --plum:#9a8fb0; --navy:#6477a0;
  --ok:#7f9a86; --warn:#b9c2cf; --bad:#c76b6b; --acc:#8fb3d6;
  --title:'UnifrakturMaguntia','Cinzel',serif; color-scheme:dark;
}
:root[data-theme="moon"] .brand-t{text-transform:none!important;letter-spacing:.012em!important}

[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}

button,select,a{touch-action:manipulation}
svg text{font-family:var(--body)}
.book{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;min-height:0;overflow:hidden;position:relative}   /* the frame: clips the content, never lays it out */
.page.scrollable{overflow-y:auto}

.pg{display:flex;flex-direction:column;gap:10px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:turn .3s cubic-bezier(.32,.72,0,1)}

/* the book header */

.hd h1 em{font-style:normal;color:var(--acc)}
.hd .sub{color:var(--ink2);font-size:15px;font-weight:500;flex:1 1 auto;min-width:0;padding-bottom:1px}
.hd .book-t{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);text-align:right;line-height:1.2;padding-bottom:1px}
.band{color:var(--ink);height:20px;display:block;width:100%;flex:none}

.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;flex:none}
.pick{display:flex;flex-direction:column;gap:3px;min-width:0}
.pick>span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
select{border:1.5px solid var(--ink);background:var(--bg);border-radius:9px;padding:8px 34px 8px 12px;font-weight:800;font-size:16px;min-height:44px;max-width:100%;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:800;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.5px solid var(--rule);background:transparent;border-radius:8px;padding:7px 10px;font-weight:800;font-size:15px;min-width:44px;min-height:44px;line-height:1.1}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:9px;padding:8px 14px;font-weight:800;min-height:44px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.small{min-height:36px;padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.35;cursor:default}
.play::before{content:"";width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;flex:none}
.play.on::before{width:10px;height:12px;border:0;border-left:3.5px solid currentColor;border-right:3.5px solid currentColor;box-sizing:border-box}
:is(.btn,.chip,.seg button,select,.cbox,.thumb,.toc button,.arrow,.rt li,.go,.icon,.tempo2 button,.rate button,.goalchip):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* sections: line-only, coloured top rule, Tenor heading with a stepped diamond */
.body{flex:1;min-height:0;display:grid;gap:14px 22px}
.sec{border-top:2.5px solid var(--c,var(--ink));padding-top:7px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}

/* diagrams */
.cgrid{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px 10px;align-items:end}

.thumb[aria-pressed="true"]{border-color:var(--ink);background:var(--panel)}
.big{display:flex;justify-content:center}.big svg{width:auto;max-width:100%;height:auto;max-height:430px}
/* tables */
table.t{width:100%;border-collapse:collapse}

.toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}

/* the practice bar, on every page */
.pbar{flex:none;z-index:10;min-height:calc(var(--barh) + env(safe-area-inset-bottom,0px));flex-wrap:wrap;row-gap:6px;padding:0 max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));
  border-top:1.5px solid var(--rule);display:flex;align-items:center;gap:10px;background:var(--bg)}

/* --- motion & press feedback: subtle, fast, purposeful (reviewed for an Apple-like feel) --- */

.go:active{transform:scale(.975)}

.ds-body{min-height:var(--room);align-items:stretch}
.ds-body>.neckwrap{display:flex;align-items:stretch;padding:14px}
table.cells.ds{height:100%;width:100%}
table.cells.ds td{font-size:24px}
table.cells.ds td small{font-size:13px}
table.cells.ds td.k{font-size:15px}
.ds-body>.stage{justify-content:center;background:var(--panel);border-radius:18px;padding:18px}
.ds-body .grid-svg svg{max-height:calc(var(--room) - 60px)}
@media (max-width:820px){
  :root{--room:auto}
  .stage.tall .sgrid .st{height:96px} .stage:not(.tall) .sgrid .st{height:64px}
  .ivgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ds-body{min-height:0} .companion svg{max-height:none;min-height:0}
}

/* ===== Liquid-glass pass: glass on the navigation layer only, springs for every motion, touch-down light ===== */
/* the material: tint from the page itself, blur + saturation for the lensing, a specular rim on top, a soft shadow under */
:root{--glass:color-mix(in srgb,var(--bg) 58%,transparent);--rim:rgba(255,255,255,.55);--glass-shadow:0 10px 30px rgba(40,25,10,.12),0 1px 3px rgba(40,25,10,.08)}
[data-theme="moon"]{--glass:color-mix(in srgb,var(--bg) 52%,transparent);--rim:rgba(255,255,255,.14);--glass-shadow:0 12px 34px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="sun"]){--glass:color-mix(in srgb,var(--bg) 52%,transparent);--rim:rgba(255,255,255,.14);--glass-shadow:0 12px 34px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4)}}
.glass,.pbar,.hd2{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8)}

/* the practice bar floats as a capsule over the page; the page scrolls under it */
.footband{display:none}
.pbar{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  min-height:0;padding:8px 10px;border:0;border-radius:32px;box-shadow:inset 0 1px 0 var(--rim),inset 0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent),var(--glass-shadow);
  background-image:radial-gradient(140px 56px at var(--sx,50%) 0%,var(--spec),transparent 70%)}
.pg{padding-bottom:calc(var(--barh) + 40px)}
:root{--room:calc(100dvh - 190px)}
.toast{bottom:calc(var(--barh) + 30px + env(safe-area-inset-bottom,0px));border-radius:999px}

/* the top bar sticks as glass; content dissolves under its soft edge, and its shadow deepens once something is under it */
.hd2{position:sticky;top:0;z-index:20;margin:-14px -16px 0;padding:10px 16px;border-radius:0 0 26px 26px;transition:box-shadow var(--sp-snap-ms) var(--sp-snap)}
.hd2::after{content:'';position:absolute;left:0;right:0;top:100%;height:18px;pointer-events:none;background:linear-gradient(var(--glass),transparent);opacity:0;transition:opacity .25s}
.under .hd2{box-shadow:inset 0 -1px 0 var(--rim),var(--glass-shadow)} .under .hd2::after{opacity:1}

/* touch-down: everything you can press sinks a little at once and lights from the touch point outward */
:is(button,.cbox,.chip,select){transition:transform var(--sp-press-ms) var(--sp-press),box-shadow var(--sp-snap-ms) var(--sp-snap),background-color .18s,color .18s}
:is(button,.cbox,.chip,select).pressing{transform:scale(.96)}
:is(.home-tiles button,.home-go).pressing{transform:scale(.975)}
.neckwrap.pressing,.pbar button.pressing{transform:none}
:is(button,.cbox,.chip,.neckwrap){position:relative;isolation:isolate}
:is(button,.cbox,.chip,.neckwrap).glow::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),color-mix(in srgb,white 55%,transparent) 0,transparent 55%);animation:glow .6s ease-out forwards}
@keyframes glow{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.25)}}
.cbox{border-radius:18px}
.cbox.on{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 30px rgba(40,25,10,.16)}

/* morphing thumbs: the selection is a glass pill that slides between options */
.seg.has-thumb,.keyring.has-thumb{position:relative}
.seg .thumb{position:absolute;z-index:0;border-radius:999px;background:var(--ink);box-shadow:inset 0 1px 0 color-mix(in srgb,white 25%,transparent),0 3px 10px rgba(40,25,10,.22);transform-origin:left center;will-change:transform}
.seg.has-thumb button{position:relative;z-index:1}
.seg.has-thumb button[aria-pressed="true"]{background:transparent}
.keyring .thumb{position:absolute;z-index:1;border-radius:14px;background:var(--ink);box-shadow:0 6px 16px rgba(40,25,10,.25);transform-origin:left top;will-change:transform}
.keyring.has-thumb button{z-index:0}
.keyring.has-thumb button[aria-pressed="true"]{background:transparent;z-index:2}
/* glass pills for the menus */
select{background-color:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 var(--rim)}

/* page turns: sharpen out of a blur and slide in on the page spring; grow out of a tapped tile */
.pg{animation:turn var(--sp-page-ms) var(--sp-page) backwards}
.pg.back{animation:turnback var(--sp-page-ms) var(--sp-page) backwards}
.pg.grow{animation:grow var(--sp-page-ms) var(--sp-page) backwards}
@keyframes turn{from{opacity:0;filter:blur(10px);transform:translateX(40px) scale(.985)}to{opacity:1;filter:none;transform:none}}
@keyframes turnback{from{opacity:0;filter:blur(10px);transform:translateX(-40px) scale(.985)}to{opacity:1;filter:none;transform:none}}
@keyframes grow{from{opacity:0;filter:blur(12px);transform:scale(.9)}to{opacity:1;filter:none;transform:none}}
/* the lit pick cell and the lit table cell pop on the press spring */
.sgrid .st{transition:background-color .12s,transform var(--sp-press-ms) var(--sp-morph)}
.sgrid .st.now{transform:scale(1.06);box-shadow:0 8px 22px color-mix(in srgb,var(--gold) 45%,transparent)}
table.cells.ds td{transition:box-shadow var(--sp-snap-ms) var(--sp-snap)}

/* Double Stops fills the room (the split rule is more specific, so match it) */
.body.split.ds-body{min-height:var(--room);align-items:stretch}

/* honour the system settings, as Liquid Glass does */
@media (prefers-reduced-motion:reduce){
  .pg,.pg.back,.pg.grow{animation:none} :is(button,.cbox,.chip,select).pressing{transform:none} .cbox.on,.sgrid .st.now{transform:none}
  :is(button,.cbox,.chip,.neckwrap).glow::after{animation-duration:.001ms}
}
@media (prefers-reduced-transparency:reduce){ .glass,.pbar,.hd2,select{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none} }
@media (prefers-contrast:more){ .pbar,.hd2{box-shadow:inset 0 0 0 2px var(--ink)} .seg .thumb,.keyring .thumb{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)} }
@media (max-width:820px){ .pbar{left:8px;right:8px;border-radius:26px;padding:6px 8px} .hd2{margin:-9px -16px 0;padding:8px 16px} }
.seg .thumb,.keyring .thumb{box-sizing:border-box;padding:0;margin:0;border:0;min-height:0;min-width:0}
/* the specular highlight is a token so the dark glass gets a faint rim, not a smear */
:root{--spec:rgba(255,255,255,.32)}
[data-theme="moon"]{--spec:rgba(255,255,255,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="sun"]){--spec:rgba(255,255,255,.05)}}
@media (max-width:820px){ .cgrid.hero-card{grid-template-columns:minmax(0,1fr)!important;justify-items:center} .hero-card .cbox svg{max-width:220px;width:220px} }

/* ===== Widgets pass (after Apple's "Design Great Widgets" and WWDC25's new design system) ===== */
/* each chapter tile is a widget: numeral, a glance at where you left that page, the name. One tap target per tile. */
.home-tiles button{justify-content:flex-start}
.home-tiles .glance{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:4px 0}
.glance .gsvg{height:100%;max-height:150px;display:flex;align-items:center;justify-content:center}
.glance .gsvg svg{height:100%;width:auto;max-width:100%}
.glance .gsvg.wide{width:100%;height:auto} .glance .gsvg.wide svg{width:100%;height:auto;max-height:140px}
.glance .mods{display:flex;gap:6px;width:100%;align-items:flex-end;height:70px}
.glance .mods i{flex:1;height:100%;border-radius:8px;background:linear-gradient(to top,var(--c) calc(var(--p) * 100%),color-mix(in srgb,var(--c) 16%,transparent) 0)}
.glance .picks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.glance .picks i{font-style:normal;font-weight:900;font-size:22px;text-align:center;padding:8px 0;border-radius:12px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.glance .picks i.up{color:var(--rust)} .glance .picks i.chop{background:var(--rust);color:var(--onacc)} .glance .picks i.rest{opacity:.4}
.glance .term-day{font-family:var(--display);font-style:normal;font-size:30px;line-height:1.1;text-align:center;color:var(--ink);text-wrap:balance}
/* Continue carries the course as a ring: done of all, filled on the snap spring when the home screen draws */
.home-go{justify-content:space-between}
.home-go .ring{--p:0;width:clamp(110px,16vw,170px);aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(closest-side,var(--rust) 82%,transparent 83%),conic-gradient(var(--onacc) calc(var(--p) * 360deg),color-mix(in srgb,var(--onacc) 22%,transparent) 0)}
.home-go .ring span{font-family:var(--display);font-size:clamp(40px,5vw,58px);line-height:1}
.home-go .ring small{font-weight:800;font-size:14px;opacity:.8}
@media (max-width:820px){ .home-go .ring{width:84px} .home-go .ring span{font-size:30px} .home-go{flex-direction:row-reverse;align-items:center;justify-content:space-between} .home-tiles .glance{display:none} }

/* concentric corners: a nested shape's radius is its parent's minus the padding between them */
:root{--r-tile:22px;--r-panel:18px}
.home-tiles button,.home-go{border-radius:var(--r-tile)}
.glance .picks i{border-radius:calc(var(--r-tile) - 14px)}
.companion,.neckwrap,.ds-body>.stage{border-radius:var(--r-panel)}

/* the practice bar steps aside while you read down a page and comes back as soon as you scroll up (tabBarMinimizeBehavior .onScrollDown) */
.pbar{transition:left var(--sp-morph-ms) var(--sp-morph),right var(--sp-morph-ms) var(--sp-morph),padding var(--sp-snap-ms) var(--sp-snap)}
.pbar .station,.pbar .cta .what{max-width:640px;overflow:hidden;transition:max-width var(--sp-morph-ms) var(--sp-morph),opacity var(--sp-snap-ms) var(--sp-snap)}
@media (min-width:821px){
  .mini .pbar{left:calc(50% - 190px);right:calc(50% - 190px);justify-content:space-between}
  .mini .pbar .station,.mini .pbar .cta .what{max-width:0;opacity:0;pointer-events:none}
}
@media (prefers-reduced-motion:reduce){ .pbar,.pbar .station,.pbar .cta .what{transition:none} }
@media (min-width:821px){ .mini .pbar:not(:has(.go)){left:calc(50% - 74px);right:calc(50% - 74px)} }
/* the progress fills in when the home screen draws: a registered number animates where a bare custom property would jump */
@property --p{syntax:'<number>';inherits:true;initial-value:0}
.home-go .ring,.glance .mods i{animation:fill 1.1s var(--sp-morph) backwards}
.glance .mods i:nth-child(n){animation-delay:calc(var(--i,0) * 40ms)}
@keyframes fill{from{--p:0}}
@media (prefers-reduced-motion:reduce){ .home-go .ring,.glance .mods i{animation:none} }
/* the lesson is the content, so it gets the big type; "Continue" is its label */
.home-go .go-t{display:flex;flex-direction:column;gap:8px}
.home-go .go-t b{font-size:clamp(28px,3.4vw,40px);line-height:1.08;text-wrap:balance}
@media (max-width:820px){ .home-go .go-t b{font-size:24px} }

/* ===== the game layer, in Sun and Moon: hearts, the chapter meter, the game bar, seals, the found bar ===== */
.quiz{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.quiz-name{display:flex;align-items:center;gap:8px;font-weight:800;align-self:center}

.qsteps i{flex:1;height:12px;border-radius:3px;background:var(--panel2)}
.qsteps i.now{background:var(--rule)}
.qsteps i.ok{background:var(--sage)}
.qsteps i.no{background:var(--bad)}
.qcount{text-align:center;font-weight:800;min-height:1.3em}
.qtext{font-size:21px;font-weight:800;min-height:1.4em;text-align:center}

.take{background:var(--panel);border-radius:var(--r-panel,14px);padding:10px 12px;display:flex;flex-direction:column;gap:8px}

.take-meter{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.take-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),color-mix(in srgb,var(--sage) 70%,var(--gold)));transition:width var(--sp-morph-ms,.4s) var(--sp-morph,ease-out)}
.take.clipped{animation:clip .5s ease-out}
@keyframes clip{0%{box-shadow:inset 0 0 0 3px var(--bad)}100%{box-shadow:inset 0 0 0 0 transparent}}
.take.kept .take-meter i{background:var(--sage)}
.gb-hearts{display:flex;gap:4px}
.gb-hearts i{font-style:normal;font-size:18px;line-height:1;color:var(--panel2);-webkit-text-stroke:1px var(--rule)}
.gb-hearts i::before{content:'♥'}
.gb-hearts i.on{color:var(--bad);-webkit-text-stroke:0;text-shadow:0 0 8px color-mix(in srgb,var(--bad) 45%,transparent)}
.pbar.gamebar{gap:10px}
.gb-stat{display:flex;flex-direction:column;align-items:center;line-height:1.05;position:relative;min-width:52px}
.gb-stat b{font-size:17px;font-weight:900;color:var(--rust);font-variant-numeric:tabular-nums}
.gb-stat small{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.gb-stat .pts-gain{position:absolute;top:-16px;right:-6px;font-size:13px;font-weight:900;color:var(--ok);animation:gain 1.2s ease-out forwards}
.gb-stat .pts-gain.neg{color:var(--bad)}
@keyframes gain{from{opacity:1;transform:translateY(4px)}to{opacity:0;transform:translateY(-10px)}}
.gb-prog{display:flex;flex-direction:column;gap:4px;min-width:150px;max-width:320px}
.gb-prog-t{display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-prog-t b{font-size:15px;font-weight:800}
.gb-prog-t small{font-size:12px;color:var(--mute);font-weight:700}
.gb-meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.gb-meter i{display:block;height:100%;background:var(--sage)}
.gb-btn{display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid var(--rule);background:transparent;border-radius:10px;padding:4px 10px;font-size:17px;font-weight:900;line-height:1.1;min-height:44px;justify-content:center;color:var(--ink)}

.gb-back{font-size:14px;flex-direction:row}
@media (max-width:820px){ .gb-btn small,.gb-stat small,.gb-prog-t small{display:none} .gb-prog{min-width:90px} .pbar.gamebar{gap:6px} }
.btn.testout{min-height:30px;font-size:12px;padding:3px 10px;border-color:rgba(255,255,255,.65);color:#fff;background:rgba(0,0,0,.18)}

/* ===== VI · the Song Sketchpad (cp-): your song | the compass with the microphone under it | then shapes, the melody neck, words and saved songs */

@media (max-width:760px){.cp-studio{grid-template-columns:minmax(0,1fr)}.cp-dialcol{order:-1}}
.cp-songbox{display:flex;flex-direction:column;gap:8px}
.cp-bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cp-bar{border:1.5px solid var(--rule);background:transparent;border-radius:9px;min-height:62px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;min-width:0;color:var(--ink)}
.cp-bar .cn{font-family:var(--display);font-size:21px;line-height:1.05}
.cp-bar .rn{font-size:11.5px;font-weight:700;color:var(--mute)}
.cp-bar.out .rn{color:var(--rust)}
.cp-bar[aria-pressed="true"]{border-color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--ink)}
.cp-bar.now{background:var(--panel2)}
.cp-bar.empty{border-style:dashed;color:var(--mute);font-weight:700;text-align:center;font-family:var(--display);font-size:22px}
.cp-bar.empty.first{font-size:12.5px;font-family:var(--body)}
.cp-x{position:absolute;top:1px;right:4px;color:var(--mute);font-size:16px;line-height:1;padding:2px 4px}
.cp-form{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:700}
.cp-form span{border-radius:6px;padding:3px 8px;color:var(--onacc)}
.cp-form span.muted,.cp-form b.muted{color:var(--mute);padding:0}
.cp-form .chip{min-height:30px;min-width:0;padding:3px 8px;font-size:12.5px}
.cp-where{border-left:3px solid var(--teal);padding:4px 0 4px 10px;font-size:14px;color:var(--ink2);display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.cp-where b{color:var(--ink)}
.cp-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cp-tools .quiet{border-color:transparent;color:var(--ink2);padding-left:4px;padding-right:4px}
.cp-dialcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.cp-dialcol>div:first-child{width:100%;display:flex;justify-content:center}
.cp-dial{width:100%;max-width:340px;height:auto;display:block;user-select:none;-webkit-user-select:none}
@media (min-height:900px){.cp-dial{max-width:440px}}
@media (max-width:760px){.cp-dial{max-width:420px}}
.cp-dial text{font-family:var(--body);pointer-events:none}
.cp-cell{cursor:pointer}
.cp-cell:focus-visible path:first-child{stroke:var(--gold);stroke-width:3}
.cp-needle{transition:transform .45s cubic-bezier(.3,1.35,.5,1);transform-origin:220px 220px}
@media (prefers-reduced-motion:reduce){.cp-needle{transition:none}}
/* the listening block under the wheel */
.cp-live{width:100%;max-width:430px;display:flex;flex-direction:column;gap:6px}
@media (max-width:820px){.cp-live{max-width:none}}
.cp-live .cp-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cp-live .cp-top .btn{min-width:7.5em;justify-content:center}
.cp-for{font-size:14px;min-height:40px;padding-top:5px;padding-bottom:4px;font-weight:700}
.cp-hear{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.cp-hear>div:first-child{min-width:0}
.cp-hear .cp-tune{grid-column:1/-1;text-align:left;color:var(--rust);font-weight:600}
.cp-hear .cp-tune:empty{display:none}
.cp-meter{position:relative;height:12px;border-radius:6px;background:var(--panel2);overflow:hidden}
.cp-meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--rule);border-radius:6px;transition:width .06s linear}
.cp-meter.hot i{background:var(--teal)}
.cp-meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.cp-cents{font-size:12px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-cents:empty{display:none}
.cp-cents.ok{color:var(--ok)}
.cp-heardbox{display:flex;align-items:baseline;gap:9px;min-width:8ch;max-width:52%;justify-content:flex-end;text-align:right;flex-wrap:wrap}
.cp-heardbox b{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;transition:opacity .2s;color:var(--ink)}
.cp-heardbox b.dim{opacity:.3}
.cp-heardbox small{font-size:12.5px;font-weight:700;color:var(--mute)}
/* the suggested chords: one line of chips, ruled in the wheel's own colours */
.cp-next{width:100%;max-width:430px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cp-next .lbl{font-size:12.5px;font-weight:700;color:var(--mute);margin-right:2px}
.cp-next .chip{border-left-width:4px;min-width:0;padding:4px 9px 3px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.cp-next .chip b{font-family:var(--display);font-weight:400;font-size:18px}
.cp-next .chip small{font-size:10.5px;font-weight:700;color:var(--mute)}
.cp-next .chip.next{border-left-color:var(--gold)}
.cp-next .chip.far{border-left-color:var(--rust)}
/* what a take heard: the chords, the key they fit */
.cp-msg{font-size:14px;color:var(--ink2)}
.cp-msg:empty{display:none}
.cp-msg b{color:var(--ink)}
.cp-take{display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--teal);padding:2px 0 2px 10px}
.cp-take .heard{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.cp-take .heard .lbl{font-size:12px;font-weight:700;color:var(--mute);margin-right:4px}
.cp-take .heard b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}
.cp-take .heard .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--mute);min-height:0;padding:0 4px;align-self:center}
.cp-take .key{font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cp-take .key .chip{min-height:30px;min-width:0;padding:3px 9px;font-size:12.5px}
.cp-take .key .chip.acc{background:var(--teal);border-color:var(--teal);color:var(--onacc)}
.cp-take .key b{color:var(--ink)}
.cp-lower{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.cp-lower .songs{display:flex;flex-wrap:wrap;gap:6px}
.cp-lower textarea{width:100%;min-height:76px;border:1.5px solid var(--rule);border-radius:9px;background:transparent;color:var(--ink);font:inherit;padding:8px}

</style>

ar":2,"count":"4","col":12},{"c":1,"f":2,"dur":"q","beats":1.0,"midi":57,"name":"A","letter":"A","acc":"","oct":3,"step":3,"show":"","bar":3,"count":"1","col":13},{"c":0,"f":2,"dur":"q","beats":1.0,"midi":52,"name":"E","letter":"E","acc":"","oct":3,"step":0,"show":"","bar":3,"count":"2","col":14},{"c":1,"f":0,"dur":"h","beats":2.0,"midi":55,"name":"G","letter":"G","acc":"","oct":3,"step":2,"show":"","bar":3,"count":"3","col":15}],"nbars":4}],"concepts":[{"id":"banjo","term":"Five-string banjo","short":"A drum with a neck: four long strings and one short one, tuned to an open G chord, with the skin head doing what a wooden top does on a guitar.","more":"The short 5th string, its own peg partway up the neck and its high-pitched drone are what make the instrument; everything in this book turns on it.","see":["fifth-string","head","tuning"]},{"id":"fifth-string","term":"The 5th string","short":"The short string with its own peg at fret 5. It is tuned to a high g — above the 1st string, not below the 4th — and starts at fret 5, so fret n on it sounds g + (n − 5).","more":"It is rarely fretted: it drones open under everything. Fretted at 5 it is the same note as open, the quickest tuning check. A capo on the long strings needs the 5th string raised too.","see":["fifth-string-peg","spikes","drone","tuning"]},{"id":"head","term":"The head","short":"The drum skin stretched over the pot. Tight and dry it rings like a banjo; slack it thuds like a drum. Mylar on most banjos; calfskin on old-time instruments.","more":"","see":["pot","bridge","tone-ring"]},{"id":"pot","term":"The pot (rim)","short":"The round wooden body the head is stretched over, held by a tension hoop and hooks. The neck bolts to it.","more":"","see":["head","tone-ring","resonator"]},{"id":"tone-ring","term":"Tone ring","short":"A metal ring between the rim and the head on a bluegrass banjo: louder, brighter, heavier. Open-back banjos often have none.","more":"","see":["pot","resonator","open-back"]},{"id":"resonator","term":"Resonator","short":"The wooden bowl on the back of a bluegrass banjo that throws the sound forward. Clawhammer players usually leave it off.","more":"","see":["open-back","tone-ring"]},{"id":"open-back","term":"Open-back banjo","short":"A banjo with no resonator: quieter, plunkier, the old-time choice. Many players stuff a cloth in the pot to soften it further.","more":"","see":["resonator","clawhammer"]},{"id":"bridge","term":"Bridge","short":"The small wooden piece the strings cross on the head, held only by string tension. Move it and the intonation moves.","more":"If the note fretted at 12 does not match the harmonic at 12, the bridge has crept. The 5th string crosses it too.","see":["intonation","head","nut"]},{"id":"tailpiece","term":"Tailpiece","short":"The metal piece at the rim the strings hook into, past the bridge. Tilting it down presses the bridge harder and brightens the tone.","more":"","see":["bridge"]},{"id":"nut","term":"Nut","short":"The slotted bar at the top of the neck the four long strings pass over: fret 0. The 5th string has its own small nut at fret 5.","more":"","see":["fret","fifth-string-peg"]},{"id":"fret","term":"Fret","short":"The metal bars across the neck; pressing just behind one shortens the string by one half step per fret. Fret 12 is the octave of the open string.","more":"","see":["half-step","octave","landmark"]},{"id":"fretboard","term":"Fretboard (fingerboard)","short":"The strip of hardwood on the face of the neck the frets are set into. A 5-string banjo has 22 frets; the 5th string reaches only the top 17 of them.","more":"","see":["fret","landmark"]},{"id":"position-markers","term":"Position markers","short":"The dots at frets 3, 5, 7, 10, 12, 15 and 17. Fret 12 gets two. Fret 5 is where the 5th string begins, so that dot is the one you look for first.","more":"","see":["landmark","fret"]},{"id":"landmark","term":"Landmarks","short":"Frets you find without counting: 5 (the 5th string starts, and the 4th string becomes G), 7 (the 1st and 5th strings meet on A), 12 (the octave).","more":"","see":["fret","octave","fifth-string"]},{"id":"headstock","term":"Headstock (peghead)","short":"The end of the neck carrying four tuning pegs — the 5th string’s peg is not here but on the side of the neck at fret 5.","more":"","see":["fifth-string-peg","tuning"]},{"id":"fifth-string-peg","term":"The 5th-string peg","short":"The tuner set into the side of the neck just above fret 5, where the short string begins. Often a geared peg; on old banjos a friction one.","more":"","see":["fifth-string","headstock"]},{"id":"spikes","term":"Railroad spikes (5th-string capo)","short":"Tiny HO-gauge model-railway spikes driven in beside the 5th string at frets 7, 8, 9 and 10: hook the string under one and it is fretted there. A sliding 5th-string capo does the same job.","more":"With a capo at 2 on the long strings the 5th string must go up two as well — spike it at 7. Capo 3, spike 8. The table in Up the Neck has the whole arithmetic.","see":["capo","fifth-string"]},{"id":"capo","term":"Capo","short":"A clamp across the long strings that raises every open string the same number of frets, so G shapes play in A at fret 2, B♭ at 3, B at 4, C at 5.","more":"The 5th string needs the same rise: spikes or a 5th-string capo. Bluegrass banjo lives at capo 2 (A) and capo 4 (B) as often as in open G.","see":["spikes","transpose","fiddle-keys"]},{"id":"strings","term":"The strings","short":"Four long strings (4th to 1st: D G B D) and the short 5th (g). Light-gauge steel; the 4th string is wound. The 1st and 5th strings are usually the same gauge.","more":"","see":["string-numbers","tuning","fifth-string"]},{"id":"string-numbers","term":"String numbers","short":"Counted from the highest long string: the 1st is the D nearest the floor, the 2nd B, the 3rd G, the 4th D nearest your chin — and then the short one is the 5th, above the 4th.","more":"Tab follows the same numbers: the 1st string is the top line, the 5th the bottom line.","see":["strings","tab","fifth-string"]},{"id":"open-string","term":"Open string","short":"A string sounded with no finger on it. On the banjo that is most of the music: the open strings are a G chord, and the 5th string is almost always open.","more":"","see":["tuning","drone","open-chord"]},{"id":"action","term":"Action","short":"The height of the strings above the frets. Banjos run low; a high bridge or a tight head raises it. Buzzing means too low, or a high fret.","more":"","see":["bridge","head"]},{"id":"intonation","term":"Intonation","short":"Whether a fretted note is in tune with the open string. Set by where the floating bridge sits: compare fret 12 with the harmonic at 12.","more":"","see":["bridge","tuner"]},{"id":"tuner","term":"Tuner","short":"The book’s tuner listens through the microphone and lights one of five lamps: g D G B D. Or tune by ear: 4th at 5 = 3rd, 3rd at 4 = 2nd, 2nd at 3 = 1st, 1st at 5 = 5th.","more":"","see":["tuning","relative-tuning"]},{"id":"relative-tuning","term":"Tuning by ear","short":"Fret the 4th string at 5 and it should match the open 3rd; the 3rd at 4 matches the 2nd; the 2nd at 3 matches the 1st; and the 1st at 5 matches the open 5th. Tune each string to the one below it.","more":"","see":["tuner","tuning","fifth-string"]},{"id":"picks","term":"Picks","short":"Bluegrass: a plastic thumb pick and two metal fingerpicks, worn with the blade under the fingertip. Clawhammer: bare fingers and one nail — fingerpicks point the wrong way for a downstroke.","more":"","see":["fingerpicks","thumb-pick","clawhammer"]},{"id":"fingerpicks","term":"Fingerpicks","short":"Metal picks on the index and middle fingers, bent to fit, the blade pointing the way the finger plucks: upward. The bright, loud Scruggs sound comes from these.","more":"","see":["picks","thumb-pick","roll"]},{"id":"thumb-pick","term":"Thumb pick","short":"A plastic pick that wraps the thumb. It plays the 3rd, 4th and 5th strings in the rolls and is the loudest voice on the banjo.","more":"","see":["picks","thumb"]},{"id":"armrest","term":"Armrest","short":"The metal bar on the rim where the forearm rests. Without it the arm damps the head.","more":"","see":["pot"]},{"id":"strap","term":"Strap","short":"Hooked to brackets on the rim, not to buttons: the banjo is heavy, and standing with one is the bluegrass way.","more":"","see":["pot"]},{"id":"tuning","term":"Open G tuning (g D G B D)","short":"The standard tuning: 4th to 1st D3 G3 B3 D4, and the short 5th string g4. Strum it open and you have a G major chord.","more":"Every other chord is a change from that. The intervals between the long strings are a fourth, a third and a minor third — nothing like the guitar’s even fourths — which is why banjo shapes are their own.","see":["open-g","fifth-string","open-chord","relative-tuning"]},{"id":"open-g","term":"Open tuning","short":"A tuning whose open strings make a chord. Open G is the banjo’s home; double C, open D and sawmill are the others worth knowing.","more":"","see":["tuning","double-c","sawmill","open-d"]},{"id":"double-c","term":"Double C tuning (g C G C D)","short":"The 4th string down to C and the 2nd up to C: the clawhammer favourite for tunes in C, and with a capo at 2 for D.","more":"","see":["open-g","sawmill","clawhammer"]},{"id":"sawmill","term":"Sawmill tuning (g D G C D)","short":"Open G with the 2nd string raised to C. No third, so neither major nor minor: the modal tuning for the old haunted tunes — Shady Grove, Cluck Old Hen.","more":"","see":["modal","open-g","dorian"]},{"id":"open-d","term":"Open D tuning (f♯ D F♯ A D)","short":"Every string retuned to a D chord, the 5th down to f♯. Bright and mournful; Reuben and the old blues live here.","more":"","see":["open-g"]},{"id":"long-neck","term":"Long-neck banjo","short":"Pete Seeger’s design: three extra frets below the nut, so the open tuning is E and a capo at 3 gives G. Folk singers’ instrument.","more":"","see":["banjo","capo"]},{"id":"tenor-banjo","term":"Tenor and plectrum banjos","short":"Four-string banjos, no short string: the tenor is tuned in fifths and played with a flatpick in Irish and jazz music. A different instrument; this book is the five-string.","more":"","see":["banjo"]},{"id":"roll","term":"Roll","short":"A repeating eight-note pattern for thumb, index and middle, one note per eighth, the melody hidden inside it. The engine of Scruggs-style banjo.","more":"The thumb takes the 3rd, 4th and 5th strings; the index the 2nd or 3rd; the middle only the 1st. No finger plays twice in a row. Learn the forward roll first.","see":["forward-roll","backward-roll","alternating-thumb-roll","thumb"]},{"id":"forward-roll","term":"Forward roll","short":"T I M T I M T I on strings 3 2 1 5 2 1 5 2: the fingers circle in one direction, the thumb dropping to the 5th every other time. The first roll, and the most used.","more":"","see":["roll","backward-roll","forward-reverse-roll"]},{"id":"backward-roll","term":"Backward roll","short":"M I T M I T M I on strings 1 2 5 1 2 5 1 2: the forward roll turned around, led by the middle finger. The Scruggs backup sound.","more":"","see":["roll","forward-roll"]},{"id":"alternating-thumb-roll","term":"Alternating thumb roll","short":"T I T M T I T M on 3 2 5 1 4 2 5 1: the thumb lands on every beat and the fingers answer in between. The oldest of the rolls.","more":"","see":["roll","thumb"]},{"id":"forward-reverse-roll","term":"Forward-reverse roll","short":"T I M T M I T M on 3 2 1 5 1 2 3 1: forward for four notes, back for four. Fills a bar of a break.","more":"","see":["roll","forward-roll"]},{"id":"foggy-mountain-roll","term":"Foggy Mountain roll","short":"I T I M I T I M on 2 3 2 1 2 3 2 1: the index leads and the thumb answers on the 3rd string. Under Foggy Mountain Breakdown, usually with a pull-off on the 2nd string.","more":"","see":["roll","pull-off"]},{"id":"thumb","term":"The thumb","short":"The loudest finger. It plays the 3rd, 4th and 5th strings in the rolls, drops to the inner strings in clawhammer, and never plays the 1st or 2nd in a roll.","more":"","see":["roll","thumb-pick","drop-thumb"]},{"id":"index","term":"The index finger","short":"In the rolls it plays the 2nd or 3rd string. In clawhammer it is the striking finger, or the middle is: one nail, striking down.","more":"","see":["roll","middle","clawhammer"]},{"id":"middle","term":"The middle finger","short":"In the rolls it plays only the 1st string. Its fingerpick is the brightest sound in a roll.","more":"","see":["roll","index"]},{"id":"pinch","term":"Pinch","short":"Thumb and a finger (or two) plucking together — a chord struck as one. The first beat of many Scruggs phrases, and the whole of the vamp.","more":"","see":["vamp","roll"]},{"id":"vamp","term":"Vamp (the chop)","short":"Bluegrass backup: a closed chord pinched on beats 2 and 4 and muted at once by relaxing the fretting hand, with the thumb on a bass note on 1 and 3. The banjo as the band’s snare drum.","more":"It only works with a moveable chord — no open strings — because an open string cannot be muted by the fretting hand.","see":["backbeat","moveable-chord","pinch","backup"]},{"id":"backbeat","term":"Backbeat","short":"Beats 2 and 4 in 4/4 (the “and” of each beat in cut time): where the vamp lands and the audience claps.","more":"","see":["vamp","beat","cut-time"]},{"id":"clawhammer","term":"Clawhammer","short":"The old-time way: the hand hangs in a loose claw and the back of a fingernail strikes down through a string; the thumb catches the 5th string on the way out. Nothing is ever plucked upward.","more":"Also called frailing, down-picking, knocking. The basic unit is the bum-ditty; melody comes from where the bum lands and from the drop-thumb.","see":["bum-ditty","frail","drop-thumb","down-stroke-only"]},{"id":"bum-ditty","term":"Bum-ditty","short":"The basic clawhammer bar: BUM (one string, on the beat), DIT (a brush across the top strings), TY (the thumb on the 5th). A quarter and two eighths; twice to a bar of 4/4.","more":"","see":["clawhammer","brush","thumb"]},{"id":"frail","term":"Frailing","short":"Another name for clawhammer — some players say frailing for the brushier, strummier style and clawhammer for the melodic one. Same hand, same downstroke.","more":"","see":["clawhammer","brush"]},{"id":"brush","term":"Brush","short":"The striking finger falling across the top three strings together instead of one: the “dit” of the bum-ditty, and the strum of the basic strum.","more":"","see":["bum-ditty","clawhammer","basic-strum"]},{"id":"drop-thumb","term":"Drop-thumb","short":"In clawhammer, the thumb leaving the 5th string to pick an inner string on the off-beat, then returning. It is how clawhammer plays melody that the striking finger cannot reach.","more":"","see":["clawhammer","thumb","double-thumb"]},{"id":"double-thumb","term":"Double thumbing","short":"Nail, thumb, nail, thumb — the thumb on the 5th string on every “and”, no brush at all. The drone becomes the rhythm.","more":"","see":["drop-thumb","clawhammer"]},{"id":"down-stroke-only","term":"The down-only stroke","short":"The structural fact of clawhammer: every stroke moves toward the floor. The wrist and forearm flick, the finger stays still, the thumb lands after. Up-strokes belong to the other styles.","more":"","see":["clawhammer","up-picking"]},{"id":"up-picking","term":"Up-picking (two-finger)","short":"An older banjo style: the index picks up on the melody string, the thumb drops on the 5th and bass strings. Between clawhammer and the rolls; Pete Seeger’s way.","more":"","see":["basic-strum","clawhammer","roll"]},{"id":"basic-strum","term":"The basic strum","short":"Seeger’s folk strum: a melody note with the index, a brush down with the back of the fingers, the thumb on the 5th. Bum-ditty with an up-picked bum.","more":"","see":["up-picking","brush"]},{"id":"scruggs-style","term":"Scruggs style","short":"Three-finger bluegrass banjo as Earl Scruggs played it: rolls with picks, the melody inside the roll, the 2–3 slide, hammer-ons and pull-offs, the vamp behind the singer.","more":"","see":["roll","earl-scruggs","slide","vamp"]},{"id":"melodic-style","term":"Melodic (Keith) style","short":"Bill Keith’s way of playing a fiddle tune note for note: rolls arranged so that consecutive scale notes fall on different strings, open strings against fretted ones.","more":"","see":["bill-keith","roll","scruggs-style"]},{"id":"single-string","term":"Single-string style","short":"Don Reno’s way: thumb and index alternating on one string, like a flatpicker, for runs and blues lines. Not a roll at all.","more":"","see":["melodic-style","scruggs-style"]},{"id":"kickoff","term":"Kickoff","short":"The instrumental intro that sets the key and tempo before the singing: often the last line of the tune, or a lick.","more":"","see":["tag","lick","break"]},{"id":"tag","term":"Tag (tag lick)","short":"A short ending phrase after the last chorus — shave-and-a-haircut in banjo clothes. The book’s tag lick hammers 0 to 2 on the 3rd string and pulls 1 to 0 on the 2nd.","more":"","see":["lick","kickoff"]},{"id":"break","term":"Break","short":"A solo over one time through the song. In bluegrass the banjo break usually comes after the first chorus, built from rolls and licks on the chord shapes.","more":"","see":["kickoff","lick","backup"]},{"id":"backup","term":"Backup","short":"What the banjo does when someone else has the melody: the vamp, a quiet backward roll up the neck, or a bum-ditty under the fiddle.","more":"","see":["vamp","break","backward-roll"]},{"id":"lick","term":"Lick","short":"A short stock phrase that fits a chord: the G lick, the tag lick, the Foggy Mountain lick. Breaks are made of licks and rolls.","more":"","see":["g-lick","tag","break"]},{"id":"g-lick","term":"The G lick","short":"The Scruggs signature: slide 2 to 3 on the 3rd string, then roll over the open 2nd, 1st and 5th. Degrees 2 ♭3 3 5 1 3 5 1 — the blue ♭3 against the chord’s own B.","more":"","see":["lick","slide","blue-note"]},{"id":"syncopation","term":"Syncopation","short":"A note landing between the beats, or an accent off the beat. Rolls are full of it: the melody note falls wherever the roll puts it, not always on the beat.","more":"","see":["offbeat","roll","accent"]},{"id":"shuffle","term":"Shuffle (swing)","short":"Eighths played long-short instead of even. Old-time tunes shuffle a little; bluegrass rolls are nearly straight.","more":"","see":["syncopation","note-values"]},{"id":"groove","term":"Groove","short":"The steady feel a band locks into. For the banjo it is an even roll or an even bum-ditty: one lumpy bar breaks it more than a wrong note.","more":"","see":["beat","backbeat"]},{"id":"accent","term":"Accent","short":"A note played louder. In a roll the melody notes are accented so the tune rises out of the stream; in clawhammer the bum is heavier than the ditty.","more":"","see":["dynamics","roll","bum-ditty"]},{"id":"downbeat","term":"Downbeat","short":"Beat 1 of the bar, the heaviest. The thumb usually lands on it.","more":"","see":["beat","offbeat","backbeat"]},{"id":"offbeat","term":"Offbeat","short":"The “and” between beats. The 5th string rings there in the double thumb, and the vamp sits there in cut time.","more":"","see":["downbeat","syncopation"]},{"id":"dynamics","term":"Dynamics","short":"Loud and soft. Fingerpicks make it hard to play quietly; backup is played near the neck with a lighter touch.","more":"","see":["accent","backup"]},{"id":"count-in","term":"Count-in","short":"The spoken count before a tune starts — “one, two, three, four” — or a kickoff that does the same job.","more":"","see":["kickoff","tempo"]},{"id":"anchor","term":"Anchoring","short":"In Scruggs style the ring and little fingers rest on the head near the bridge so the hand has a fixed place to roll from. Clawhammer players anchor lightly or not at all.","more":"","see":["roll","clawhammer"]},{"id":"open-chord","term":"Open chord","short":"A chord using open strings, near the nut: G (nothing fretted), C, D, D7, Em, Am and their families.","more":"","see":["moveable-chord","chord-box","tuning"]},{"id":"moveable-chord","term":"Moveable chord (the three forms)","short":"A chord with no open string, so it slides to any key: the barre, the F shape and the D shape. Every major chord on the neck is one of the three somewhere.","more":"The root sits on the 3rd string under the barre, on the 4th and 1st strings in the F shape, on the 4th string in the D shape. Minor and seventh versions move one finger.","see":["barre","f-shape","d-shape","vamp","up-the-neck"]},{"id":"barre","term":"Barre","short":"One finger across all four long strings: a major chord with the root on the 3rd string. Fret 5 is C, fret 7 is D, fret 12 is G again. At fret 0 it is the open G.","more":"","see":["moveable-chord","f-shape","d-shape"]},{"id":"f-shape","term":"The F shape","short":"The open F chord (3 2 1 3) slid up the neck: root on the 4th and 1st strings, which is why it is the bluegrass backup shape — the thumb has the root under it.","more":"","see":["moveable-chord","barre","d-shape"]},{"id":"d-shape","term":"The D shape","short":"The open D chord (0 2 3 4) slid up with the 4th string fretted: root on the 4th string under the index. A stretch, and the brightest of the three.","more":"","see":["moveable-chord","barre","f-shape"]},{"id":"chord-box","term":"Chord box","short":"The diagram: four vertical lines are the long strings, 4th on the left to 1st on the right; a dot is a fretted note with its finger number; ○ an open string. The 5th string is left off because it drones open.","more":"","see":["finger-numbers","open-chord","fifth-string"]},{"id":"finger-numbers","term":"Finger numbers","short":"1 index, 2 middle, 3 ring, 4 little, for the fretting hand. The right hand uses letters: T I M.","more":"","see":["chord-box","roll"]},{"id":"closed-position","term":"Closed position","short":"A hand position with no open strings, so everything under it moves with the hand. The moveable forms and the position scale shapes.","more":"","see":["moveable-chord","up-the-neck","position-shift"]},{"id":"first-position","term":"First position","short":"The hand at the nut: index on fret 1 or 2, little finger reaching 4 or 5, open strings ringing. The G scale, the open chords and most of the first tunes live here.","more":"","see":["closed-position","open-chord"]},{"id":"up-the-neck","term":"Up the neck","short":"Playing above fret 5: the moveable forms, the backup vamp, the high breaks. The 5th string keeps droning its g wherever the hand goes.","more":"","see":["moveable-chord","closed-position","capo"]},{"id":"position-shift","term":"Position shift","short":"Moving the whole hand to a new fret: from an F shape at 5 to a D shape at 7, say. The three forms are a map of where to shift.","more":"","see":["closed-position","moveable-chord"]},{"id":"slide","term":"Slide","short":"Fret a note, pick it, and push the finger up the string while it rings so the pitch climbs. The 2-to-3 slide on the 3rd string is the bluegrass banjo sound.","more":"","see":["hammer-on","pull-off","g-lick"]},{"id":"hammer-on","term":"Hammer-on","short":"Sound a higher note by slamming a fretting finger down, without picking again. Open 3rd string hammered at 2 (G to A); open 2nd hammered at 1 in C (B to C).","more":"","see":["pull-off","slide","legato"]},{"id":"pull-off","term":"Pull-off","short":"The hammer-on reversed: pluck the fretting finger off sideways so the lower note sounds. 2nd string 1 to 0 in C; 3rd string 2 to 0 in G.","more":"","see":["hammer-on","slide","foggy-mountain-roll"]},{"id":"choke","term":"Choke (bend)","short":"Push a fretted string sideways so its pitch rises, then let it back. Scruggs chokes the 2nd string at fret 10 in Foggy Mountain Breakdown.","more":"","see":["slide","blue-note"]},{"id":"muted-note","term":"Muted note","short":"A string struck while the fretting hand damps it: a thud, not a note. The vamp is a chord muted the instant it is struck.","more":"","see":["vamp","moveable-chord"]},{"id":"drone","term":"Drone","short":"A note that rings under everything. The open 5th string is the banjo’s drone: a high g over every chord, in tune with G and C, rubbing against D7 — and played anyway.","more":"","see":["fifth-string","open-string","modal"]},{"id":"harmonics","term":"Harmonics (chimes)","short":"Touch a string lightly over fret 12, 7 or 5 and pick: a bell-like note. At 12 it is the octave, and it is how you check the bridge.","more":"","see":["intonation","octave"]},{"id":"arpeggio","term":"Arpeggio","short":"A chord played one note at a time. A roll over a chord is an arpeggio with a rhythm.","more":"","see":["roll","chord-tone"]},{"id":"legato","term":"Legato","short":"Notes joined smoothly. Hammer-ons, pull-offs and slides are the banjo’s legato: one pick stroke, two notes.","more":"","see":["hammer-on","pull-off","slide"]},{"id":"vibrato","term":"Vibrato","short":"A fretted note wavered by rocking the finger. Rare on the banjo — the notes are too short — but it lives in a held choke.","more":"","see":["choke"]},{"id":"note","term":"Note","short":"A single pitch, named with the letters A to G.","more":"","see":["half-step","octave","musical-alphabet"]},{"id":"musical-alphabet","term":"The musical alphabet","short":"A B C D E F G, then A again. Between most letters there is one fret with a sharp or flat name; between B–C and E–F there is none.","more":"","see":["note","half-step","natural"]},{"id":"half-step","term":"Half step","short":"One fret. The smallest move in Western music; twelve of them make an octave.","more":"","see":["whole-step","fret"]},{"id":"whole-step","term":"Whole step","short":"Two frets. The major scale is whole steps with two half steps in it: W W H W W W H.","more":"","see":["half-step","major-scale"]},{"id":"chromatic","term":"Chromatic scale","short":"All twelve notes in a row, one per fret. Walk any string from open to 12 and you have played it.","more":"","see":["half-step","musical-alphabet"]},{"id":"natural","term":"Natural (♮)","short":"A plain letter name with no sharp or flat; also the sign that cancels one.","more":"","see":["sharp","flat","accidental"]},{"id":"sharp","term":"Sharp (♯)","short":"One half step higher — one fret up. Sharps arrive in the order F C G D A E B: G has one, D two, A three.","more":"","see":["flat","key-signature"]},{"id":"flat","term":"Flat (♭)","short":"One half step lower — one fret down. Flats arrive B E A D G C F.","more":"","see":["sharp","key-signature"]},{"id":"accidental","term":"Accidental","short":"A sharp, flat or natural written beside a note for that bar only, outside the key signature. The blue ♭3 in a G tune is one.","more":"","see":["sharp","flat","natural","key-signature"]},{"id":"enharmonic","term":"Enharmonic","short":"Two names for one fret: F♯ and G♭, B♭ and A♯. The key decides which to write.","more":"","see":["sharp","flat"]},{"id":"octave","term":"Octave","short":"The same note higher: twelve frets. On the banjo the 5th string is the 3rd string’s octave; fret 12 on any string is its open note again.","more":"","see":["note","fret","fifth-string"]},{"id":"unison","term":"Unison","short":"Two strings on the same note: the 1st string at fret 5 and the open 5th string; the 4th at 5 and the open 3rd.","more":"","see":["relative-tuning","octave"]},{"id":"interval","term":"Interval","short":"The distance between two notes, counted in letters and measured in frets. The tuning is intervals: D to G a fourth, G to B a third, B to D a minor third.","more":"","see":["third","fourth","fifth","octave"]},{"id":"interval-quality","term":"Interval quality","short":"Major, minor, perfect, diminished, augmented: the exact size of an interval in frets once its letter-count is known. A third is four frets (major) or three (minor).","more":"","see":["interval","perfect-interval","third"]},{"id":"perfect-interval","term":"Perfect intervals","short":"Unison, fourth, fifth and octave: the ones that are neither major nor minor. The banjo’s D to G is a perfect fourth, G to D a perfect fifth.","more":"","see":["interval-quality","fourth","fifth"]},{"id":"third","term":"Third","short":"Two letters up: four frets is major (bright), three is minor (soft). The 3rd and 2nd strings are a major third apart — G to B — which is why the tuning is a major chord.","more":"","see":["interval","major-chord","minor-chord"]},{"id":"fourth","term":"Perfect fourth","short":"Five frets: D to G, the 4th string to the 3rd. Fret 5 on a string is a fourth above it.","more":"","see":["interval","fifth"]},{"id":"fifth","term":"Perfect fifth","short":"Seven frets: G to D, the 3rd string to the 1st. The 5th string g sits a perfect fourth above the 1st string’s D — five frets — not a fifth; the string’s number is a count, not an interval.","more":"The fifth is the chord’s frame: root and fifth, with the third deciding major or minor.","see":["interval","fourth","triad"]},{"id":"sixth","term":"Sixth","short":"Nine frets (major) or eight (minor): a third turned over. The 4th string to the 2nd is a major sixth, D to B.","more":"","see":["third","interval"]},{"id":"tritone","term":"Tritone","short":"Six frets: the restless interval between the third and seventh of a dominant chord. In D7 it is F♯ and C, and it is why D7 pulls to G.","more":"","see":["dominant-seventh","interval"]},{"id":"augmented","term":"Augmented","short":"A perfect or major interval stretched one fret wider; an augmented triad has a sharp fifth.","more":"","see":["interval-quality","diminished"]},{"id":"diminished","term":"Diminished","short":"A perfect or minor interval shrunk one fret; a diminished triad (vii° in a key) has a flat fifth. Gdim7 slides every three frets and is still Gdim7.","more":"","see":["augmented","diminished-seventh"]},{"id":"inversion","term":"Inversion","short":"A chord with a note other than its root at the bottom. The barre form has its root on the 3rd string, so the 4th string D under a G barre is a fifth — the chord is inverted and nobody minds.","more":"","see":["chord","root","voicing"]},{"id":"transpose","term":"Transpose","short":"Move a tune to another key. The banjo transposes with a capo (and the 5th string spiked up the same amount) or by sliding a moveable form.","more":"","see":["capo","moveable-chord","key"]},{"id":"scale","term":"Scale","short":"A home note and its family, in order. A tune draws its notes from one.","more":"","see":["major-scale","pentatonic","mode","key"]},{"id":"scale-degree","term":"Scale degree","short":"A note’s number in its scale: 1 is the root, 5 the fifth. The licks in this book are written as degrees so they move to any key.","more":"","see":["scale","tonic","root"]},{"id":"diatonic","term":"Diatonic","short":"Belonging to the key: a diatonic note is in the scale, a diatonic chord is built from it. The blue ♭3 is not diatonic, and that is its charm.","more":"","see":["scale","key","blue-note"]},{"id":"major-scale","term":"Major scale","short":"W W H W W W H: do re mi. In G it runs G A B C D E F♯ G — on the banjo, 3rd string open and 2, 2nd open and 1, 1st open 2 4 5.","more":"","see":["scale","key","whole-step"]},{"id":"minor-scale","term":"Minor scale","short":"The darker cousin: ♭3 ♭6 ♭7. Natural minor is the major scale started from its 6th note; most “minor” banjo tunes are Dorian or in sawmill tuning.","more":"","see":["natural-minor","relative-minor","dorian"]},{"id":"natural-minor","term":"Natural minor (Aeolian)","short":"The relative minor’s own scale: E minor has G major’s notes, starting on E. Wayfaring Stranger.","more":"","see":["minor-scale","relative-minor","aeolian"]},{"id":"harmonic-minor","term":"Harmonic minor","short":"Natural minor with the 7th raised so the V chord pulls home. The step-and-a-half gap is the sound. Rare on the banjo.","more":"","see":["natural-minor","leading-tone"]},{"id":"pentatonic","term":"Pentatonic","short":"Five notes, no half steps. The major pentatonic is a Scruggs break; the minor pentatonic is the blues. Nothing in them clashes with the chord.","more":"","see":["major-pentatonic","blues-scale","scale"]},{"id":"major-pentatonic","term":"Major pentatonic","short":"Degrees 1 2 3 5 6: the major scale without its 4 and 7. Cumberland Gap is all of it; so are most bluegrass fills.","more":"","see":["pentatonic","cumberland-gap"]},{"id":"blues-scale","term":"Blues scale","short":"Minor pentatonic with the ♭5 added. The Scruggs slide from 2 to ♭3 on the 3rd string is the first blue note every banjo player learns.","more":"","see":["blue-note","pentatonic","slide"]},{"id":"blue-note","term":"Blue note","short":"A ♭3, ♭5 or ♭7 played against a major chord: B♭ in a G tune. On the banjo it arrives by slide or choke, usually on the way to the proper note.","more":"","see":["blues-scale","slide","choke"]},{"id":"mode","term":"Mode","short":"The major scale started on a different note: same notes, different home. Old-time tunes use two of them constantly.","more":"","see":["mixolydian","dorian","modal"]},{"id":"ionian","term":"Ionian","short":"The major scale under its old name: the first mode.","more":"","see":["mode","major-scale"]},{"id":"dorian","term":"Dorian","short":"Minor with a bright 6th: the fiddle’s minor. Shady Grove, Cold Frosty Morning. On the banjo, sawmill tuning puts it under the fingers.","more":"","see":["mode","sawmill","modal"]},{"id":"mixolydian","term":"Mixolydian","short":"Major with a flat 7th: Old Joe Clark, Cluck Old Hen, June Apple. The tune sounds major but never resolves; the chord under the ♭7 is the ♭VII.","more":"","see":["mode","modal","borrowed-chord"]},{"id":"aeolian","term":"Aeolian","short":"Natural minor under its modal name: the sixth mode.","more":"","see":["natural-minor","mode"]},{"id":"modal","term":"Modal tunes","short":"Old-time tunes in Mixolydian or Dorian rather than plain major or minor, often played in sawmill or double C tuning with the 5th string droning through.","more":"","see":["mixolydian","dorian","sawmill","drone"]},{"id":"key","term":"Key","short":"The home note of a tune plus its scale. Open G is the banjo’s home; C and D are played with open shapes; A, B♭ and B with a capo and G shapes.","more":"Bluegrass keys follow the singer: G, A, B♭, B, C, D. The fiddle keys are G, D and A.","see":["key-signature","circle-of-fifths","fiddle-keys","capo"]},{"id":"key-signature","term":"Key signature","short":"The sharps or flats at the start of the staff that belong to the key. None is C, one sharp is G, two is D, three is A.","more":"","see":["key","sharp","flat"]},{"id":"tonic","term":"Tonic","short":"The home note of a key — where a tune comes to rest. Degree 1.","more":"","see":["key","scale-degree"]},{"id":"supertonic","term":"Supertonic (ii)","short":"The second degree and the minor chord on it: Am in G.","more":"","see":["scale-degree","roman-numerals"]},{"id":"mediant","term":"Mediant (iii)","short":"The third degree and its minor chord: Bm in G.","more":"","see":["scale-degree","roman-numerals"]},{"id":"subdominant","term":"Subdominant (IV)","short":"The fourth degree and its major chord: C in G. The chord most songs go to first.","more":"","see":["three-chord-song","roman-numerals"]},{"id":"dominant","term":"Dominant (V)","short":"The fifth degree and its major chord: D in G. Add the seventh and it pulls home harder.","more":"","see":["dominant-seventh","three-chord-song","roman-numerals"]},{"id":"submediant","term":"Submediant (vi)","short":"The sixth degree and its minor chord: Em in G, the relative minor.","more":"","see":["relative-minor","roman-numerals"]},{"id":"leading-tone","term":"Leading tone","short":"The seventh degree, one fret under the tonic: F♯ in G. It leans home.","more":"","see":["scale-degree","dominant-seventh"]},{"id":"circle-of-fifths","term":"Circle of fifths","short":"The twelve keys in a ring, each a fifth up from the last, each adding a sharp. A key’s V is one step clockwise, its IV one step back; the three touching keys are the three chords most tunes use.","more":"","see":["key","fifth","relative-minor"]},{"id":"relative-minor","term":"Relative minor","short":"The minor key sharing a major key’s notes, a minor third below: E minor for G, B minor for D, A minor for C.","more":"","see":["natural-minor","key"]},{"id":"parallel-key","term":"Parallel key","short":"The major and minor keys on the same tonic: G and G minor. Sawmill tuning sits between them with no third at all.","more":"","see":["relative-minor","sawmill"]},{"id":"modulation","term":"Modulation","short":"Changing key inside a song. Bluegrass bands do it by capoing up a fret for the last chorus — the banjo re-spikes the 5th string.","more":"","see":["key","capo"]},{"id":"fiddle-keys","term":"The fiddle keys","short":"G, D and A — the keys fiddle tunes live in because of the fiddle’s open strings. The banjo plays G open, D from the open 4th string, and A at capo 2 with the 5th string at 7.","more":"","see":["key","capo","spikes"]},{"id":"root","term":"Root","short":"The note a chord is named after and built up from. The three forms differ in which string the root sits on.","more":"","see":["chord","triad","moveable-chord"]},{"id":"chord","term":"Chord","short":"Three or more notes sounding together. On the banjo the four long strings play it and the 5th string adds a g on top whether or not it belongs.","more":"","see":["triad","root","open-chord","fifth-string"]},{"id":"triad","term":"Triad","short":"The basic three-note chord: root, third, fifth. The open strings D G B D are a G triad with the D doubled.","more":"","see":["chord","third","fifth"]},{"id":"chord-quality","term":"Chord quality","short":"What kind of chord it is: major, minor, seventh, diminished. Set by the third and the seventh.","more":"","see":["major-chord","minor-chord","seventh-chord"]},{"id":"major-chord","term":"Major chord","short":"A triad with a major third — bright. G, C, D, A. The open tuning is one.","more":"","see":["triad","third","minor-chord"]},{"id":"minor-chord","term":"Minor chord","short":"A triad with a minor third — darker. One fret separates it from major: lower the third. E (2 1 0 2) becomes Em (2 0 0 2).","more":"","see":["triad","third","major-chord"]},{"id":"seventh-chord","term":"Seventh chord","short":"A triad with a seventh on top. D7 is the one every G tune comes home from; G7 leans toward C.","more":"","see":["dominant-seventh","major-seventh","minor-seventh"]},{"id":"dominant-seventh","term":"Dominant seventh (V7)","short":"A major triad plus the flat seventh: D7 in G, G7 in C. The tritone inside it pulls to the I chord.","more":"","see":["seventh-chord","tritone","cadence"]},{"id":"major-seventh","term":"Major seventh","short":"A major triad plus the major seventh: Gmaj7 (0 0 0 4), Dmaj7. Soft and unresolved; more songs than breakdowns.","more":"","see":["seventh-chord"]},{"id":"minor-seventh","term":"Minor seventh","short":"A minor triad plus the flat seventh: Em7 (0 0 0 2), which is also G6 — the same four notes.","more":"","see":["seventh-chord","minor-chord"]},{"id":"sus-chord","term":"Suspended chord","short":"The third replaced by the fourth (sus4) or second (sus2): Gsus4 (0 0 1 0), Csus4. Sawmill tuning is Gsus4 as a tuning.","more":"","see":["chord","sawmill"]},{"id":"add9","term":"Add9","short":"A major triad with the second added on top: Cadd9 (0 0 1 2), the open D ringing inside a C chord. The folk-song colour.","more":"","see":["chord","major-chord"]},{"id":"diminished-seventh","term":"Diminished seventh","short":"Four notes a minor third apart: Gdim7 (2 3 2 5) is also B♭dim7, D♭dim7 and Edim7, so the shape slides every three frets and stays the same chord.","more":"","see":["diminished","moveable-chord"]},{"id":"chord-tone","term":"Chord tone","short":"A note that belongs to the chord underneath — root, third, fifth or seventh. The safe notes for a break; the roll plays nothing else.","more":"","see":["chord","arpeggio","roll"]},{"id":"voicing","term":"Voicing","short":"Which notes of a chord sit on which strings. G open, G barre at 12, G in the F shape at 5 and G in the D shape at 5 are four voicings of one chord.","more":"","see":["moveable-chord","inversion"]},{"id":"roman-numerals","term":"Roman numerals","short":"Chords named by their place in the key: I IV V major, ii iii vi minor, vii° diminished. A progression written this way works in any key, and at any capo.","more":"","see":["progression","nashville-numbers","key"]},{"id":"nashville-numbers","term":"Nashville numbers","short":"The same idea with Arabic numerals — 1 4 5 — as session players write charts. Capo 2 and the numbers do not change.","more":"","see":["roman-numerals","capo"]},{"id":"progression","term":"Progression","short":"The sequence of chords under a tune. I IV V is most of bluegrass; I and ♭VII is most of Old Joe Clark.","more":"","see":["three-chord-song","roman-numerals","cadence"]},{"id":"three-chord-song","term":"The three-chord song","short":"I, IV and V: G, C and D in G. Learn those three and D7 and you can sit in on hundreds of songs tonight.","more":"","see":["progression","subdominant","dominant"]},{"id":"cadence","term":"Cadence","short":"How a phrase lands: V to I is finished; ending on V hangs. The last two bars of every tune part are a cadence; the tag lick is one.","more":"","see":["authentic-cadence","half-cadence","tag"]},{"id":"authentic-cadence","term":"Authentic cadence","short":"V (or V7) to I: D7 to G. The full stop.","more":"","see":["cadence","dominant-seventh"]},{"id":"plagal-cadence","term":"Plagal cadence","short":"IV to I: C to G, the “amen”. Softer than V to I.","more":"","see":["cadence","subdominant"]},{"id":"half-cadence","term":"Half cadence","short":"A phrase ending on V, like a comma. The first half of a fiddle tune’s A part usually does this.","more":"","see":["cadence","dominant"]},{"id":"deceptive-cadence","term":"Deceptive cadence","short":"V going to vi instead of I: D to Em. The surprise.","more":"","see":["cadence","submediant"]},{"id":"resolution","term":"Resolution","short":"The tension of V letting go into I. The tritone in D7 — F♯ and C — closes to G and B.","more":"","see":["cadence","tritone"]},{"id":"turnaround","term":"Turnaround","short":"The last bars of a section that lead back to the top: I IV V I, or the tag lick leading into the next verse.","more":"","see":["progression","tag"]},{"id":"twelve-bar-blues","term":"Twelve-bar blues","short":"I I I I · IV IV I I · V IV I V, twelve bars round and round. Salty Dog and most bluegrass blues use pieces of it.","more":"","see":["progression","blues-scale"]},{"id":"borrowed-chord","term":"Borrowed chord","short":"A chord from outside the key: the ♭VII (F in G) under a Mixolydian tune, the minor iv for a sweet turn.","more":"","see":["mixolydian","progression"]},{"id":"harmony","term":"Harmony","short":"Notes that agree with the melody: a second voice a third above, or the chord under the tune. The roll supplies harmony automatically — the melody rides on chord tones.","more":"","see":["chord-tone","third","roll"]},{"id":"beat","term":"Beat","short":"The steady pulse you tap your foot to. In a roll the thumb mostly lands on it; in clawhammer the bum does.","more":"","see":["downbeat","tempo","time-signature"]},{"id":"bar","term":"Bar (measure)","short":"A group of beats between two bar lines: four in 4/4, three in a waltz. One roll fills one bar.","more":"","see":["beat","time-signature","roll"]},{"id":"tempo","term":"Tempo (BPM)","short":"How fast the beat goes, in beats per minute. The practice bar sets it; the metronome keeps it. Breakdowns run past 120 in cut time.","more":"","see":["beat","cut-time"]},{"id":"time-signature","term":"Time signature","short":"Beats per bar and which note gets a beat: 4/4 for most tunes, 2/2 (cut time) for bluegrass songs, 2/4 for breakdowns, 3/4 for waltzes.","more":"","see":["beat","cut-time","bar"]},{"id":"cut-time","term":"Cut time (2/2)","short":"Two half-note beats a bar: the bluegrass feel. The same notes as 4/4 but counted in two, with the vamp on the “and” of each big beat.","more":"","see":["time-signature","backbeat","vamp"]},{"id":"compound-time","term":"Compound time","short":"Beats that divide in three, as in 6/8. Rare in banjo music; Irish jigs on the tenor banjo live there.","more":"","see":["time-signature","tenor-banjo"]},{"id":"note-values","term":"Note values","short":"Whole (4 beats), half (2), quarter (1), eighth (½), sixteenth (¼). A roll is eighths; a bum-ditty is a quarter and two eighths.","more":"","see":["beat","rest","dotted-note"]},{"id":"rest","term":"Rest","short":"A silence of a note’s length, with its own sign. Rare in rolls, which never stop.","more":"","see":["note-values"]},{"id":"beam","term":"Beam","short":"The bar joining the stems of eighths or sixteenths: a grouping for the eye, one beat at a time.","more":"","see":["note-values"]},{"id":"dotted-note","term":"Dotted note","short":"A dot after a note adds half its length: a dotted quarter is a beat and a half.","more":"","see":["note-values","shuffle"]},{"id":"tie","term":"Tie","short":"A curve joining two notes of the same pitch into one longer note. Not a slur: a slur between different notes is a hammer-on or pull-off in tab.","more":"","see":["note-values","hammer-on"]},{"id":"pickup-notes","term":"Pickup notes","short":"Notes before the first full bar: a kickoff into the tune.","more":"","see":["bar","kickoff"]},{"id":"repeat-sign","term":"Repeat sign","short":"Two dots at a double bar: go back. Fiddle tunes repeat each part.","more":"","see":["aabb","endings"]},{"id":"endings","term":"First and second endings","short":"A bracket marked 1 over the last bar the first time through and 2 the second: the repeat takes a different exit.","more":"","see":["repeat-sign","aabb"]},{"id":"staff","term":"The staff","short":"Five lines music is written on. The banjo reads the treble clef, written an octave above where it sounds: lines E G B D F, spaces F A C E, the open 4th string just under the bottom line.","more":"","see":["clef","tab","written-pitch"]},{"id":"clef","term":"Clef","short":"The sign at the start of the staff. Banjo music uses the treble clef (𝄞), like the guitar.","more":"","see":["staff"]},{"id":"tab","term":"Tab (tablature)","short":"Five lines, one per string, the 1st string on top and the short 5th string at the bottom; a number is the fret to play. Letters under it say which finger: T I M, or n br T for clawhammer. Tab says where, not how long — read the rhythm from the stems or the staff.","more":"","see":["staff","string-numbers","fret"]},{"id":"ledger-line","term":"Ledger line","short":"A short extra line for notes above or below the staff. The 5th string’s g sits just above the staff; the 4th string’s D just below.","more":"","see":["staff"]},{"id":"written-pitch","term":"Written an octave up","short":"Banjo and guitar music is written an octave higher than it sounds so it fits the treble staff. The open 4th string sounds D3 and is written D4.","more":"","see":["staff","octave"]},{"id":"triplet","term":"Triplet","short":"Three notes in the time of two. A tag often ends with one.","more":"","see":["note-values","tag"]},{"id":"fiddle-tune","term":"Fiddle tune","short":"A dance tune — reel, breakdown, hornpipe, waltz — passed on by ear, in AABB form, played round and round. The banjo doubles the fiddle or rolls under it.","more":"","see":["aabb","reel","breakdown"]},{"id":"breakdown","term":"Breakdown","short":"A fast bluegrass instrumental, usually a fiddle tune at speed, with a break for each instrument: Foggy Mountain Breakdown, Earl’s Breakdown.","more":"","see":["fiddle-tune","break","foggy-mountain-breakdown"]},{"id":"reel","term":"Reel","short":"A dance tune in 4/4 (or 2/4): straight eighths, a lean on 1 and 3. Most old-time tunes are reels whether anyone calls them that.","more":"","see":["fiddle-tune","time-signature"]},{"id":"waltz","term":"Waltz","short":"A tune in 3/4: ONE two three. The banjo plays bass on 1 and brushes 2 and 3 — Kentucky Waltz, Tennessee Waltz.","more":"","see":["time-signature","brush"]},{"id":"hornpipe","term":"Hornpipe","short":"A 4/4 tune played dotted — long-short — with a swagger. Sailor’s Hornpipe is the melodic-style showpiece.","more":"","see":["reel","dotted-note","melodic-style"]},{"id":"march","term":"March","short":"A tune in 2/4 or 4/4 with a steady step, slower than a reel. Some old-time tunes are marches in disguise.","more":"","see":["reel","time-signature"]},{"id":"modal-tune","term":"Modal tune","short":"An old-time tune in Mixolydian or Dorian, often in sawmill tuning: Cluck Old Hen, Shady Grove, Pretty Polly.","more":"","see":["modal","sawmill"]},{"id":"aabb","term":"AABB form","short":"Almost every fiddle tune: an 8-bar A part twice, an 8-bar B part twice, 32 bars a time through. Learn the A part and you know a quarter of the tune.","more":"","see":["fiddle-tune","repeat-sign"]},{"id":"verse-chorus","term":"Verse and chorus","short":"The song shapes behind bluegrass singing: verses tell the story, the chorus repeats. The banjo vamps under the verse and takes its break over one.","more":"","see":["break","backup"]},{"id":"session","term":"Jam (session)","short":"Players in a circle trading tunes. An old-time jam plays the tune in unison, round and round; a bluegrass jam passes breaks round the circle while the rest vamp.","more":"","see":["fiddle-tune","break","vamp"]},{"id":"cripple-creek","term":"Cripple Creek","short":"The first tune in both styles: a G tune with an A part that climbs down from the high D. Scruggs rolls it; clawhammer bum-dittys it.","more":"","see":["fiddle-tune","scruggs-style","clawhammer"]},{"id":"cumberland-gap","term":"Cumberland Gap","short":"The clawhammer tune that lives on the 5th-string drone: all pentatonic, mostly one chord, the thumb everywhere.","more":"","see":["fiddle-tune","major-pentatonic","drone"]},{"id":"boil-them-cabbage","term":"Boil Them Cabbage Down","short":"Three notes and three chords, I IV I V. The tune everyone learns to roll over first, because the roll does the work.","more":"","see":["three-chord-song","roll"]},{"id":"foggy-mountain-breakdown","term":"Foggy Mountain Breakdown","short":"Earl Scruggs’s 1949 showpiece: the Foggy Mountain roll with a pull-off on the 2nd string, the choke at fret 10, Em in a G tune. The sound of a banjo to most of the world.","more":"","see":["foggy-mountain-roll","choke","earl-scruggs"]},{"id":"earl-scruggs","term":"Earl Scruggs","short":"The North Carolina player who brought the three-finger roll to Bill Monroe’s band in 1945 and made it bluegrass banjo. Scruggs style is named for him.","more":"","see":["scruggs-style","roll","foggy-mountain-breakdown"]},{"id":"bill-keith","term":"Bill Keith","short":"The player who, in the 1960s, worked out how to play fiddle tunes note for note inside the rolls: the melodic style. Also invented the D-tuner pegs.","more":"","see":["melodic-style","roll"]},{"id":"clawhammer-masters","term":"The clawhammer tradition","short":"Uncle Dave Macon, Clarence Ashley, Hobart Smith, Kyle Creed, Fred Cockerham: the old-time players whose records are the clawhammer canon.","more":"","see":["clawhammer","modal-tune"]}],"aliases":{"five-string":"banjo","5-string":"banjo","fifth string":"fifth-string","5th string":"fifth-string","short string":"fifth-string","drum head":"head","skin":"head","rim":"pot","tone rings":"tone-ring","resonators":"resonator","open-backs":"open-back","frets":"fret","neck":"fretboard","fingerboard":"fretboard","dots":"position-markers","landmarks":"landmark","peghead":"headstock","railroad spikes":"spikes","spike":"spikes","fifth-string capo":"spikes","5th-string capo":"spikes","capos":"capo","string":"strings","open strings":"open-string","thumb pick":"thumb-pick","thumbpick":"thumb-pick","finger picks":"fingerpicks","fingerpick":"fingerpicks","open g":"tuning","g tuning":"tuning","open tunings":"open-g",
