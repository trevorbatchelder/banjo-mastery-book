    () => { const m = D.meters[rnd(D.meters.length)]; return {q: `${m.sig} is called:`, a: m.name, opts: strOpts(m.name, D.meters.map(x => x.name)), hint: m.blurb.split(';')[0], why: `${m.sig}, ${m.name}: ${m.blurb}.`}; },
    Q('A breakdown is usually written in:', '2/4 — two quarter beats a bar, played fast', ['3/4', '6/8', '12/8'], 'Fast, in two.', 'Fiddle tunes and breakdowns are often written in 2/4. Felt the same as cut time: two beats a bar.'),
    Q('The backbeat in 4/4 is:', 'beats 2 and 4', ['beats 1 and 3', 'every “and”', 'beat 1 only'], 'Where the vamp lands.', 'Beats 2 and 4: the vamp, the clap, the snare. In cut time the same places are the “and” of each big beat.'),
    Q('Tempo is measured in:', 'beats per minute', ['bars per minute', 'notes per bar', 'frets per second'], 'BPM.', 'The practice bar sets it. Breakdowns run past 120 in cut time; a waltz sits around 90.'),
    Q('Pickup notes are:', 'notes before the first full bar — a kickoff into the tune', ['the last notes', 'a repeat', 'notes on the 5th string'], 'Before bar 1.', 'Many tunes start on a pickup: a few notes leading to the downbeat of bar 1.'),
  ],
  keysigs: [
    () => { const k = rndKey(); const sig = _COF.find(x => x[0] === k)[1]; return {q: `A key signature of ${sig === '—' ? 'no sharps or flats' : sig} is the key of:`, a: k, opts: keyOpts(k), hint: 'Count round the circle from C.', why: `${sig === '—' ? 'No sharps or flats' : sig}: ${k} major (or ${_SIG[k].rel} minor).`}; },
    () => { const k = ['G', 'D', 'A', 'E', 'F', 'B♭', 'E♭'][rnd(7)]; const a = _SIG[k].notes.join(', '); return {q: `The key signature of ${k} major sharpens or flattens:`, a, opts: strOpts(a, ['G', 'D', 'A', 'E', 'F', 'B♭', 'E♭', 'A♭'].map(x => _SIG[x].notes.join(', '))), hint: `${k}: ${D.keyScales[k].join(' ')}.`, why: `${k} major: ${D.keyScales[k].join(' ')} — ${a}.`}; },
    Q('The key signature is written:', 'at the start of each line, and holds for the whole piece', ['before each note', 'at the end', 'only in the first bar'], 'Once per line.', 'Every F in a G tune is sharp without a mark of its own; a ♮ cancels it for one bar.'),
    Q('One sharp in the signature means:', 'G major or E minor', ['D major', 'F major', 'C major'], 'F♯.', 'One sharp, F♯: G major, or its relative E minor. The banjo’s home key.'),
    Q('Two sharps mean:', 'D major or B minor', ['G major', 'A major', 'B♭ major'], 'F♯ and C♯.', 'Two sharps: D major, the fiddler’s key. The banjo plays it from the open 4th string, or capos 2 and plays C shapes.'),
    Q('An accidental is:', 'a sharp, flat or natural beside a note for that bar only', ['a wrong note', 'a key signature', 'a grace note'], 'Outside the key.', 'The blue ♭3 in a G tune is written as an accidental: B♭ with a flat beside it, cancelled at the next bar line.'),
    () => { const k = rndKey(); const n = _SIG[k].n; return {q: `How many sharps or flats does ${k} major have?`, a: String(n), opts: numOpts(String(n), ['0', '1', '2', '3', '4', '5', '6']), hint: `${k}: ${D.keyScales[k].join(' ')}.`, why: `${k} major has ${n} ${_SIG[k].acc === '♯' ? 'sharp' : 'flat'}${n === 1 ? '' : 's'}${n ? ': ' + _SIG[k].notes.join(', ') : ''}.`}; },
  ],
  tunes: [
    () => { const t = D.tunes[rnd(D.tunes.length)]; return {q: `${t.name} is in the key of:`, a: t.key, opts: keyOpts(t.key), hint: 'The banjo’s home.', why: `${t.name}: ${t.blurb}. Chords: ${t.chords.join(' ')}.`, play: () => hearNotes(t.notes.filter(n => !n.rest).slice(0, 8).map(n => n.midi), .22)}; },
    () => { const t = D.tunes[rnd(D.tunes.length)]; return {q: `${t.name} uses the chords:`, a: [...new Set(t.chords)].join(' '), opts: strOpts([...new Set(t.chords)].join(' '), D.tunes.map(x => [...new Set(x.chords)].join(' ')).concat(['I IV V vi', 'i iv V'])), hint: t.blurb.split(':')[0], why: `${t.name}: ${t.chords.join(' ')}, one chord a bar.`}; },
    Q('AABB form means:', 'an 8-bar A part played twice, then an 8-bar B part played twice', ['two tunes joined', 'the A part four times', 'a 4-bar tune'], '32 bars.', `${D.formAABB.blurb}.`),
    Q('The first tunes most banjo players learn are:', 'Cripple Creek, Boil Them Cabbage Down and Cumberland Gap', ['Foggy Mountain Breakdown and Dueling Banjos', 'Sailor’s Hornpipe and Devil’s Dream', 'the twelve-bar blues'], 'Three chords or fewer.', 'Three chords or fewer, the melody on open strings and the first five frets, playable in a roll or a bum-ditty.'),
    () => { const t = D.tunes[rnd(D.tunes.length)]; return {q: `${t.name} is written in:`, a: t.meter, opts: strOpts(t.meter, ['4/4', '3/4', '6/8', '2/2']), hint: 'Count the beats in a bar.', why: `${t.name}: ${t.meter}, ${t.bars} bars in this phrase.`}; },
    Q('Foggy Mountain Breakdown is:', 'Earl Scruggs’s 1949 showpiece: the Foggy Mountain roll, a pull-off on the 2nd string, the choke at fret 10, Em in a G tune', ['a clawhammer tune in sawmill tuning', 'a waltz', 'a Bill Keith composition'], 'The sound of a banjo to most of the world.', 'The Foggy Mountain roll with its pull-off, the choke, and Em where the ear expects C.'),
    Q('An old-time jam and a bluegrass jam differ in that:', 'old-time plays the tune in unison round and round; bluegrass passes breaks round the circle', ['old-time uses picks', 'bluegrass has no banjo', 'old-time is faster'], 'Unison versus breaks.', 'In an old-time jam everyone plays the tune together, many times; in a bluegrass jam each player takes a break while the rest vamp.'),
    () => { const t = D.tunes[rnd(D.tunes.length)]; return {q: `${t.name} belongs most to which tradition?`, a: t.tradition === 'old-time' ? 'old-time (clawhammer)' : 'bluegrass (Scruggs style)', opts: ['old-time (clawhammer)', 'bluegrass (Scruggs style)', 'Irish session', 'jazz'], hint: t.blurb, why: `${t.name}: ${t.blurb} — though both traditions play it.`}; },
  ],
};
// helpers the factories above use
function ROMAN_N(d) { return ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'][d]; }
function degree_sp(k, semis) { return keyNoteName(k, (pcof(k) + semis) % 12) === SH[(pcof(k) + semis) % 12] ? SH[(pcof(k) + semis) % 12] : keyNoteName(k, (pcof(k) + semis) % 12); }
function fretsUp(s, shift = 0) { const pcs = keyPcs('G'); const out = []; for (let f = 0; f <= 12 && out.length < 5; f++) if (pcs.includes((OPENM[s] + f + shift) % 12)) out.push(f); return out.join(' '); }
function tabPlayerOnce(L) { return () => { audio(); const t0 = A.ctx.currentTime + .02; L.notes.forEach((n, i) => bnote(n.midi, t0 + i * .2, {gain: L.marks.some(([k]) => k + 1 === i) ? .22 : .36, fin: n.fin})); }; }

// every hint and explanation reads as a sentence: a capital after each full stop (blurbs come from the export in lower case)
const _sent = t => typeof t === 'string' ? t.replace(/^([a-z])/, m => m.toUpperCase()).replace(/([.:]) ([a-z])(?=[a-z]* )/g, (m, p, c) => p === '.' ? `${p} ${c.toUpperCase()}` : m) : t;
for (const t in QBANK) QBANK[t] = QBANK[t].map(f => () => { const Q = f(); if (Q) { Q.why = _sent(Q.why); Q.hint = _sent(Q.hint); } return Q; });

/* ---------------------------------------------------------------- the Index */
PAGES.push({id: 'index', no: 'VII', name: 'The Index', blurb: 'every term and idea in the book, organized', acc: 'var(--navy)', draw(v) {
  pageScroll = true;
  v.append(header('VII', 'The Index'));
  const st = state('indexpage', {sec: 'az'});
  const go = sec => { st.sec = sec; keep('indexpage', st); redraw(); };
  const navBtn = ([sec, label]) => h('button', {class: 'btn' + (st.sec === sec ? ' acc' : ''), style: 'justify-content:flex-start;text-align:left;min-height:42px', on: {click: () => go(sec)}}, label);
  const nav = h('div', {style: 'display:flex;flex-direction:column;gap:6px'},
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin-bottom:2px'}, 'THE TERMS'),
    navBtn(['az', 'Everything A–Z']), ...IDX_GROUPS.map(g => navBtn([g[0], g[1]])),
    h('div', {class: 'muted', style: 'font-weight:800;letter-spacing:.14em;font-size:12px;margin:10px 0 2px'}, 'THE IDEAS'),
    ...INDEX_SUBS.filter(s => s[0] !== 'glossary').map(([k, nm]) => navBtn(['facts:' + k, nm])));
  const body = h('div', {style: 'display:flex;flex-direction:column;gap:12px;min-width:0'});
  const row = c => discovered(c.id) ? h('button', {class: 'gloss-row', 'data-c': c.id}, h('b', {}, c.term), h('span', {}, c.short))
    : h('button', {class: 'gloss-row unfound', 'data-c': c.id, title: 'Not found yet — it still opens'}, h('b', {}, '? ' + c.term), h('span', {}, `Not found yet · ${whereFound(c.id)}`));
  const nFound = (D.concepts || []).filter(c => discovered(c.id)).length, nAll = (D.concepts || []).length;
  if (!bookMode()) body.append(h('div', {class: 'found-bar'}, h('b', {}, `${nFound} of ${nAll} found`), h('span', {}, 'clear chapters, visit pages and tap terms in the book to collect them all'),
    h('div', {class: 'found-meter'}, h('i', {style: `width:${Math.round(nFound / nAll * 100)}%`}))));
  if (st.sec.startsWith('facts:')) {
    const k = st.sec.slice(6), name = (INDEX_SUBS.find(s => s[0] === k) || [])[1], facts = (D.theory.facts || []).filter(f => f.tag === k);
    body.append(sec2(name, 'the ideas behind the lessons · tap any term to open it', 'var(--navy)',
      h('div', {class: 'facts'}, facts.map(f => h('div', {class: 'fact'}, h('h3', {}, f.t), h('p', {html: glossify(f.b)}))))));
  } else if (st.sec === 'az') {
    const cs = (D.concepts || []).slice().sort((a, b) => a.term.localeCompare(b.term));
    const list = h('div', {class: 'gloss'}); let letter = '';
    cs.forEach(c => { const l = c.term[0].toUpperCase();
      if (l !== letter) { letter = l; list.append(h('div', {style: 'grid-column:1/-1;font-weight:900;color:var(--navy);margin:8px 0 0;letter-spacing:.1em'}, l)); }
      list.append(row(c)); });
    body.append(sec2('Everything A–Z', 'every term in the book · tap one to open it, then follow “see also”', 'var(--navy)', list));
  } else {
    const g = IDX_GROUPS.find(x => x[0] === st.sec) || IDX_GROUPS[0], byId = {}; (D.concepts || []).forEach(c => byId[c.id] = c);
    body.append(sec2(g[1], 'tap a term to open it · related terms link onward', 'var(--navy)',
      h('div', {class: 'gloss'}, g[2].filter(id => byId[id]).map(id => row(byId[id])))));

  v.append(h('div', {class: 'body', style: 'grid-template-columns:minmax(185px,.3fr) minmax(0,1fr);align-items:start'}, nav, body));

/* ---------------------------------------------------------------- motion: springs, touch-down feedback, morphing thumbs, fluid page turns */
/* ================================================================ MOTION: one spring, touch-down feedback, morphing thumbs, fluid page turns
   After Apple's WWDC18 "Designing Fluid Interfaces" and WWDC25 "Meet Liquid Glass":
   respond on touch-down and commit on touch-up; describe motion by damping and response, never duration;
   stay interruptible (a new touch takes over from wherever the motion is); things grow from where you touched
   and leave the way they came; materialize by sharpening out of a blur rather than fading. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
// a damped spring from 0 to 1: damping ratio ζ (1 = no overshoot), response T (seconds for one undamped cycle)
function springAt(t, zeta, T) {
  const w0 = 2 * Math.PI / T;
  if (zeta >= 1) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
  const wd = w0 * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + zeta * w0 / wd * Math.sin(wd * t));
}
// the same spring as a CSS linear() easing and the time it takes to settle, so CSS and JS move alike
function springCSS(zeta, T) {
  let end = T; for (let t = T * 4; t > 0; t -= 0.004) if (Math.abs(1 - springAt(t, zeta, T)) > 0.001) { end = t + 0.004; break; }
  const pts = Array.from({length: 48}, (_, i) => +springAt(end * i / 47, zeta, T).toFixed(4)); pts[47] = 1;
  return {ease: `linear(${pts.join(', ')})`, ms: Math.round(end * 1000)};
}
// four springs for the whole book: press (quick, firm), snap (no overshoot), morph (a little squish), page (gentle)
const SPRINGS = {press: springCSS(1, .22), snap: springCSS(1, .38), morph: springCSS(.78, .42), page: springCSS(.9, .55)};
(() => { const r = document.documentElement.style; for (const [k, s] of Object.entries(SPRINGS)) { r.setProperty(`--sp-${k}`, s.ease); r.setProperty(`--sp-${k}-ms`, s.ms + 'ms'); } })();

/* ---------------- touch-down: press in at once, glow from the exact touch point, commit on release (the browser's click) */
const PRESSABLE = 'button,.cbox,.chip,select,.neckwrap';
let lastTap = {x: 0, y: 0, t: 0, el: null};
document.addEventListener('pointerdown', e => {
  lastTap = {x: e.clientX, y: e.clientY, t: performance.now(), el: e.target};
  const el = e.target.closest(PRESSABLE); if (!el || el.disabled) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--gx', `${e.clientX - r.left}px`); el.style.setProperty('--gy', `${e.clientY - r.top}px`);
  el.classList.remove('glow'); void el.offsetWidth; el.classList.add('pressing', 'glow');
  const up = () => { el.classList.remove('pressing'); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.removeEventListener('pointerleave', up); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
}, {passive: true});
document.addEventListener('animationend', e => { if (e.animationName === 'glow') e.target.classList.remove('glow'); });

/* ---------------- morphing thumbs: a segmented control's selection (and the key ring's) slides to its new place.
   The page redraws on every choice, so each group's last thumb rect is remembered by name and the new thumb
   springs from there (FLIP). */
const THUMBS = new Map();
function placeThumbs(v) {
  const pid = (PAGES[at] || {}).id;
  v.querySelectorAll('.seg, .keyring').forEach((g, n) => {
    if (g.classList.contains('multi')) return;   // a multi-select seg (the reading layers) keeps every pressed button lit; no single pill
    const on = g.querySelector('[aria-pressed="true"]'); if (!on) return;
    const key = `${pid}:${g.getAttribute('aria-label') || g.className}:${n}`;
    const th = h('span', {class: 'thumb', 'aria-hidden': 'true'}); g.prepend(th); g.classList.add('has-thumb');
    const put = () => { th.style.left = on.offsetLeft + 'px'; th.style.top = on.offsetTop + 'px'; th.style.width = on.offsetWidth + 'px'; th.style.height = on.offsetHeight + 'px'; };
    put();
    const was = THUMBS.get(key), now = {x: on.offsetLeft, y: on.offsetTop, w: on.offsetWidth, h: on.offsetHeight};
    THUMBS.set(key, now);
    if (!was || REDUCED.matches || (was.x === now.x && was.y === now.y && was.w === now.w)) return;
    const dx = was.x - now.x, dy = was.y - now.y, sx = was.w / now.w;
    th.animate([{transform: `translate(${dx}px, ${dy}px) scaleX(${sx})`}, {transform: 'none'}], {duration: SPRINGS.morph.ms, easing: SPRINGS.morph.ease});
    th.animate([{filter: 'brightness(1.35)'}, {filter: 'none'}], {duration: SPRINGS.morph.ms * .8, easing: 'ease-out'});   // the glass "energizes" as it moves
  });
}

/* ---------------- page turns: grow out of what you tapped; slide in from the side you swiped toward */
function materialize(v, back) {
  document.dispatchEvent(new Event('turn'));   // a new page starts with the practice bar out
  if (REDUCED.matches) return;
  const recent = performance.now() - lastTap.t < 600 && lastTap.el && lastTap.el.closest && lastTap.el.closest('.home-tiles button, .home-go, .term, .cpop button');
  v.classList.remove('grow');
  if (recent) { const r = v.getBoundingClientRect(); v.style.transformOrigin = `${lastTap.x - r.left}px ${lastTap.y - r.top + ($('#page').scrollTop || 0)}px`; v.classList.add('grow'); }
  else v.style.transformOrigin = '';
}

/* ---------------- the swipe: the page follows the finger, and release velocity decides — a flick turns it, a slow
   drag past a quarter of the width turns it, anything less springs home. A new touch catches it mid-flight. */
(() => {
  const frame = $('#page'); if (!frame) return;
  let x0 = 0, y0 = 0, dx = 0, lock = null, samples = [], start = 0;
  const pg = () => $('#pg');
  const set = (x, tr) => { const p = pg(); p.style.transition = tr || 'none'; p.style.transform = x ? `translateX(${x}px)` : ''; p.style.opacity = tr || !x ? '' : String(1 - Math.min(.35, Math.abs(x) / innerWidth * .6)); };
  frame.addEventListener('touchstart', e => {
    if (e.touches.length > 1 || e.target.closest('.neckwrap,.tabwrap,.scroll,input,select,textarea,.lib')) { lock = 'no'; return; }
    const t = e.touches[0], m = new DOMMatrix(getComputedStyle(pg()).transform);   // catch a page that is still springing back
    start = m.m41; x0 = t.clientX - start; y0 = t.clientY; dx = start; lock = null; samples = [[t.clientX, performance.now()]];
    if (start) set(start);
  }, {passive: true});
  frame.addEventListener('touchmove', e => {
    if (lock === 'no') return; const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!lock) { if (Math.hypot(mx - start, my) < 10) return; lock = Math.abs(mx - start) > Math.abs(my) * 1.3 ? 'x' : 'no'; if (lock === 'no') { if (start) set(0, `transform var(--sp-snap-ms) var(--sp-snap)`); return; } }
    dx = mx; samples.push([t.clientX, performance.now()]); if (samples.length > 6) samples.shift();
    set(dx);
  }, {passive: true});
  const end = () => {
    if (lock !== 'x') { lock = null; return; } lock = null;
    const [a, b] = [samples[0], samples[samples.length - 1]], vel = b && a && b[1] > a[1] ? (b[0] - a[0]) / (b[1] - a[1]) : 0;   // px per ms
    const projected = dx + vel * 180, w = innerWidth;
    if (Math.abs(projected) > w * .25 && Math.abs(dx) > 24) {
      const dir = projected < 0 ? 1 : -1;
      set(-dir * w * .5, `transform ${SPRINGS.press.ms}ms ease-in, opacity ${SPRINGS.press.ms}ms ease-in`); pg().style.opacity = '0';
      setTimeout(() => { const p = pg(); p.style.transition = 'none'; p.style.transform = ''; p.style.opacity = ''; page(at + dir, dir < 0); }, SPRINGS.press.ms * .8);
    } else set(0, `transform var(--sp-morph-ms) var(--sp-morph), opacity var(--sp-snap-ms) var(--sp-snap)`);
  };
  frame.addEventListener('touchend', end, {passive: true}); frame.addEventListener('touchcancel', end, {passive: true});
})();

/* ---------------- the glass bars: a shadow that deepens when content scrolls under the top bar, and a highlight that follows the finger */
(() => {
  const frame = $('#page'); if (!frame) return;
  // the practice bar minimizes on a scroll down and returns on any scroll up, near the top, or at the end of the page
  let lastY = 0, travel = 0;
  const R = document.documentElement, mini = on => R.classList.toggle('mini', on);
  frame.addEventListener('scroll', () => {
    const y = frame.scrollTop, dy = y - lastY; lastY = y; R.classList.toggle('under', y > 6);
    travel = Math.sign(dy) === Math.sign(travel) ? travel + dy : dy;   // distance moved in one direction, so a jitter does not flip it
    if (y < 60 || y + frame.clientHeight > frame.scrollHeight - 4) mini(false);
    else if (travel > 24) mini(true); else if (travel < -12) mini(false);
  }, {passive: true});
  document.addEventListener('turn', () => { lastY = 0; travel = 0; mini(false); });
  const bar = $('#pbar');
  bar && bar.addEventListener('pointerdown', e => { if (R.classList.contains('mini') && !e.target.closest('button')) mini(false); });
  bar && bar.addEventListener('pointermove', e => { const r = bar.getBoundingClientRect(); bar.style.setProperty('--sx', `${((e.clientX - r.left) / r.width * 100).toFixed(1)}%`); }, {passive: true});
})();

// the book's reading order: the course up front, then the rooms, then the Index
const PAGE_ORDER = ['cover', 'learn', 'chords', 'scales', 'righthand', 'upneck', 'sketch', 'index'];
PAGES.sort((a, b) => PAGE_ORDER.indexOf(a.id) - PAGE_ORDER.indexOf(b.id));
PAGES.forEach(p => p.blurb = p.blurb || '');
const start = (location.hash || '').slice(1), si = PAGES.findIndex(p => p.id === start);
page(si >= 0 ? si : store.get('at', 0));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
