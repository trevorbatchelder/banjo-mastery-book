"bpm":"tempo","time signatures":"time-signature","cut time":"cut-time","compound":"compound-time","note value":"note-values","quarter note":"note-values","quarter notes":"note-values","eighth note":"note-values","eighth notes":"note-values","eighths":"note-values","rests":"rest","beams":"beam","beamed":"beam","dotted":"dotted-note","ties":"tie","tied":"tie","pickup":"pickup-notes","pickups":"pickup-notes","anacrusis":"pickup-notes","repeat signs":"repeat-sign","first ending":"endings","second ending":"endings","treble clef":"clef","tablature":"tab","ledger lines":"ledger-line","written pitch":"written-pitch","triplets":"triplet","fiddle tunes":"fiddle-tune","breakdowns":"breakdown","reels":"reel","waltzes":"waltz","hornpipes":"hornpipe","marches":"march","modal tunes":"modal-tune","verse":"verse-chorus","chorus":"verse-chorus","jam":"session","jams":"session","sessions":"session","boil them cabbage down":"boil-them-cabbage","foggy mountain breakdown":"foggy-mountain-breakdown","scruggs’s":"earl-scruggs","keith":"bill-keith"},"theory":{"facts":[{"t":"A drum with a neck","b":"The banjo’s body is a drum: a skin head over a wooden rim, with a floating bridge standing on it. That is why it is loud, bright and short — the head rings fast and dies fast, and a note is gone almost as soon as it is played. Rolls exist to fill that silence.","tag":"instrument"},{"t":"The 5th string","b":"The short string has its own peg at fret 5 and is tuned to a high g, above the 1st string. It starts at fret 5, so a capo on the long strings leaves it behind: raise it by the same number of frets with a spike or a 5th-string capo. Fretted at 5 it is the same as open — the quickest tuning check there is.","tag":"instrument"},{"t":"Open G is a chord","b":"g D G B D: strum the open strings and you have played G major. Every other chord is a change from that, which is why G, C and D7 come so easily and why E♭ does not.","tag":"instrument"},{"t":"Picks or nails","b":"Scruggs style wears a thumb pick and two fingerpicks, blades under the fingertips, because the fingers pluck upward. Clawhammer uses bare fingers and one nail, because the hand only moves down — a fingerpick points the wrong way. The two hands are different instruments on the same banjo.","tag":"instrument"},{"t":"Tune the strings to each other","b":"4th at 5 is the 3rd; 3rd at 4 is the 2nd; 2nd at 3 is the 1st; 1st at 5 is the 5th. The intervals are a fourth, a major third, a minor third and a fourth: nothing like the guitar’s even fourths, which is why banjo shapes are their own.","tag":"neck"},{"t":"Fret 5 and fret 7","b":"Fret 5 is where the 5th string begins and where the 4th string becomes G. Fret 7 is where the 1st string and the 5th string meet on A — the first place up the neck to look for a chord.","tag":"neck"},{"t":"The 5th string is the 3rd string’s octave","b":"G3 on the open 3rd, g4 on the open 5th. Fret 12 on the 3rd string is the open 5th; fret 17 on the 5th string is its own octave. Up the neck the drone keeps ringing g whatever the hand does.","tag":"neck"},{"t":"Fewest fingers first","b":"G needs none, C and D7 three, Em two. With G, C, D7 and Em you can play along with most of a jam tonight; the rest of the chords can wait for the rolls.","tag":"chords"},{"t":"Three forms, every major chord","b":"The barre (root on the 3rd string), the F shape (root on the 4th and 1st) and the D shape (root on the 4th) each slide to every key. Minor and seventh versions move one finger. Learn where each form keeps its root and you can find any chord by counting frets.","tag":"chords"},{"t":"Why moveable chords have no open string","b":"A chord with an open string cannot be muted by relaxing the fretting hand, and it cannot slide. Closed forms give you both: the vamp’s bark on 2 and 4, and every key.","tag":"chords"},{"t":"Drop the third one fret","b":"E becomes Em, D becomes Dm, the F shape becomes its minor: lower the third one fret. The third is the only note that decides major from minor; the root and fifth stay put.","tag":"chords"},{"t":"The capo arithmetic","b":"Capo n plays G shapes in the key n frets above G: 2 is A, 3 is B♭, 4 is B, 5 is C. The 5th string must rise the same n: spike it at 5 + n. Capo 2, spike 7; capo 3, spike 8; capo 4, spike 9.","tag":"upneck"},{"t":"Bluegrass keys","b":"G, A, B♭, B, C and D, chosen for the singer. The banjo plays G open and capos for A, B♭ and B; C and D have their own open shapes or sit at capo 5 and capo 7. The guitar does the same with its capo; the mandolin slides closed chords instead.","tag":"upneck"},{"t":"Vamp up the neck","b":"Backup lives above fret 5: an F shape or a D shape pinched on 2 and 4 and muted at once. The chords are close together there — G at 5 in the F shape, C at 5 in the barre, D at 7 in the barre — so the hand hardly moves.","tag":"upneck"},{"t":"The roll is the instrument","b":"Eight eighth notes a bar, thumb, index and middle, never the same finger twice in a row. The melody rides inside the roll on the thumb and the accents; the rest is a shimmer of chord tones. Scruggs did not play tunes with rolls underneath: the roll is the tune.","tag":"righthand"},{"t":"The thumb owns three strings","b":"In a roll the thumb plays the 3rd, 4th and 5th strings, the index the 2nd or 3rd, the middle only the 1st. Every roll in the book obeys this, so a roll is a string pattern as much as a finger pattern.","tag":"righthand"},{"t":"Bum-ditty","b":"One string on the beat, a brush across the top, the thumb on the 5th: a quarter and two eighths, twice a bar. Every clawhammer tune is this bar with the bum moved to the melody and the thumb dropping to inner strings. Count it aloud and it fixes itself.","tag":"righthand"},{"t":"The hand only moves down","b":"Clawhammer has no upstroke. The striking finger falls through the string like a hammer and the thumb catches the 5th string on the way out. The three faults are plucking upward, a silent thumb and rushing the ditty.","tag":"righthand"},{"t":"The slide from 2 to 3","b":"Pick the 3rd string at fret 2 and push to 3: A to B♭, the blue ♭3 against the G chord’s own B. It is the first lick every bluegrass banjo player learns and the one that says Scruggs. The clean version goes on to 4.","tag":"righthand"},{"t":"First position in G","b":"G A B C D E F♯ G: the 3rd string open and 2, the 2nd open and 1, the 1st open 2 4 5. The whole scale fits under one hand, and the 5th string drones its g through all of it.","tag":"scales"},{"t":"The pentatonic break","b":"Drop the 4 and the 7 and nothing clashes: five safe notes, the shape of most Scruggs fills and all of Cumberland Gap. Add the ♭3 as a slide and it turns blue.","tag":"scales"},{"t":"Positions follow the forms","b":"A one-octave scale fits inside the box each moveable chord form sits in. Fret the form, play the scale around it, and a break stays under the hand instead of chasing the neck.","tag":"scales"},{"t":"The old-time modes","b":"Old Joe Clark sounds major but has an F natural: Mixolydian, major with a ♭7. Shady Grove sounds minor but has a bright sixth: Dorian. Sawmill tuning puts both under the fingers by removing the third from the open chord.","tag":"scales"},{"t":"Chords in a key","b":"Build a triad on each note of the major scale and the pattern is always major, minor, minor, major, major, minor, diminished — I ii iii IV V vi vii°. In G: G Am Bm C D Em F♯°. Most tunes use I, IV and V.","tag":"keys"},{"t":"G D A are the fiddle keys","b":"The fiddle’s open strings make G, D and A the dance keys. The banjo plays G open, D from the open 4th string and A at capo 2 with the 5th string spiked at 7.","tag":"keys"},{"t":"Relative minor","b":"E minor has exactly G major’s notes, so the Em chord sits inside the key of G and most minor-sounding bluegrass songs are really G songs that lean on Em.","tag":"keys"},{"t":"Tab says where, the stems say when","b":"Five lines, the 1st string on top and the short 5th at the bottom; a number is a fret. Tab has no rhythm of its own, so the stems underneath (or the staff above) say how long each note is. The letters under the tab say which finger.","tag":"reading"},{"t":"Written an octave up","b":"Banjo music is written in the treble clef an octave above where it sounds, like guitar music. The open 4th string sounds D3 and sits just under the bottom line as D4; the 5th string’s g sits just above the staff.","tag":"reading"},{"t":"A roll is a bar of eighths","b":"Eight eighth notes fill a bar of 4/4, and that is exactly one roll. Read a bar of eighths on the staff and you are reading a roll; the question is only which string each note lands on.","tag":"reading"},{"t":"Cut time","b":"Bluegrass songs feel in two: two big beats a bar, the vamp on the “and” of each. Written 2/2, it looks like 4/4 and goes twice as fast as it reads.","tag":"reading"},{"t":"AABB","b":"Almost every fiddle tune is an 8-bar A part played twice and an 8-bar B part played twice. Learn the A part of Cripple Creek and you already have a quarter of it.","tag":"tunes"},{"t":"Two traditions, one instrument","b":"Bluegrass (Scruggs) and old-time (clawhammer) share the banjo and the tunes and almost nothing about the right hand. Neither is the older or the better one to start with; the book teaches both and lets you choose.","tag":"tunes"},{"t":"The first tunes","b":"Cripple Creek, Boil Them Cabbage Down and Cumberland Gap: three chords or fewer, the melody on open strings and the first five frets, playable in a roll or a bum-ditty. Every banjo player’s first month.","tag":"tunes"},{"t":"Kickoffs and tags","b":"A break starts with a kickoff — often the tune’s last line — and the song ends with a tag: hammer the 3rd string, roll across, pull the 2nd string off, land on G. Shave-and-a-haircut.","tag":"tunes"}]},"qualIv":{"":[0,4,7],"m":[0,3,7],"°":[0,3,6],"7":[0,4,7,10],"m7":[0,3,7,10],"maj7":[0,4,7,11],"m7♭5":[0,3,6,10],"sus2":[0,2,7],"sus4":[0,5,7],"add9":[0,2,4,7],"7♭9":[0,1,4,7,10],"6":[0,4,7,9],"m6":[0,3,7,9],"9":[0,2,4 /* every page tries to fit in the frame above the practice bar: scale the page down to the space it has so it
   sits on one screen. If it still can't fit (a page too tall even at the smallest scale), the frame scrolls

function fit() {

  const forceScroll = window.innerWidth < 980 || pageScroll || (PAGES[at] && PAGES[at].id === 'sketch');
  pg.style.zoom = '';
  if (forceScroll) { frame.classList.add('scrollable'); return; }
  const avail = frame.clientHeight, content = pg.scrollHeight;   // the frame it has vs the natural content it holds
  if (content > avail + 1) {

    pg.style.zoom = z.toFixed(4);
    // scrollHeight is the pre-zoom estimate; the page can settle a little taller (fonts/SVG, sub-pixel rounding),
    // which the frame would then clip. Re-measure the real scaled height and tighten the zoom once so it truly fits.
    const real = pg.getBoundingClientRect().height;

function roadView(v) {

        mDone < m.lessons.filter(l => !l.exam).length && m.lessons.some(l => l.topic) ? h('button', {class: 'btn small testout', title: `One long battle over all of ${m.name}. Win it and the whole module is cleared.`,
          on: {click: () => { const s = state('course', {}); s.challenge = mi; s.open = -1; keep('course', s); redraw(); }}}, 'Test out') : '')));
    m.lessons.forEach(l => {
      const idx = gi++, st = cleared[chapKey(l)] ? 'done' : (idx <= firstOpen ? 'open' : 'lock'), unlocked = st !== 'lock', off = offs[idx % offs.length];
      const node = h('button', {class: 'btn', disabled: !unlocked, 'aria-label': l.name,
        style: `width:64px;height:64px;min-width:64px;border-radius:50%;padding:0;font-size:24px;font-weight:900;display:grid;place-items:center;flex:none;`
          + `background:${st === 'done' ? 'var(--sage)' : st === 'open' ? m.acc : 'var(--rule)'};color:${st === 'lock' ? 'var(--mute)' : '#fff'};border:4px solid rgba(0,0,0,.16);box-shadow:0 3px 0 rgba(0,0,0,.16);` + (unlocked ? '' : 'opacity:.55;cursor:default'),
        on: unlocked ? {click: () => { const s = state('course', {}); s.open = idx; keep('course', s); redraw(); }} : {}},
        st === 'done' ? '✓' : st === 'open' ? (l.exam ? '★' : '▶') : '🔒');
      nodeEls.push(node); nodeSts.push(st);
      const nodeWrap = h('div', {style: 'position:relative;flex:none'}, node);
      if (idx === firstOpen) { wizHolder = h('div', {style: 'position:absolute;left:50%;top:-42px;transform:translateX(-50%);z-index:3;pointer-events:none'}, mageTile(0, 46)); nodeWrap.append(wizHolder); }
      wrap.append(h('div', {style: `display:flex;align-items:center;gap:16px;margin:14px 0;transform:translateX(${off}px)`},
        nodeWrap, h('div', {style: `font-weight:800;font-size:15px;max-width:230px;color:${unlocked ? 'var(--ink)' : 'var(--mute)'};`

  setTimeout(() => {
    // paint the world once the DOM has laid out, so the path can wind through the real node centres
    MP = mapPal();
    const S = 4, r0 = scene.getBoundingClientRect();
    if (!r0.width || !r0.height) return;
    const W = Math.ceil(r0.width / S), H = Math.ceil(r0.height / S);
    cv.width = W; cv.height = H; cv.style.width = r0.width + 'px'; cv.style.height = r0.height + 'px';
    const ctx = cv.getContext('2d');
    drawGround(ctx, W, H);
    const pts = nodeEls.map(el => { const r = el.getBoundingClientRect(); return [(r.left + r.width / 2 - r0.left) / S, (r.top + r.height / 2 - r0.top) / S]; });
    // the banked path: a dark edge pass, a light fill pass, then the gold guide dots
    const walk = (rad, col) => { ctx.fillStyle = col;
      for (let k = 0; k + 1 < pts.length; k++) { const [x1, y1] = pts[k], [x2, y2] = pts[k + 1], n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 2));
        for (let t = 0; t <= n; t++) DISC(ctx, Math.round(x1 + (x2 - x1) * t / n), Math.round(y1 + (y2 - y1) * t / n), rad, col); } };
    walk(7, MP.pathEdge); walk(5, MP.path);
    ctx.fillStyle = MP.dot;
    for (let k = 0; k + 1 < pts.length; k++) { const [x1, y1] = pts[k], [x2, y2] = pts[k + 1], n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / 9));
      for (let t = 1; t < n; t++) ctx.fillRect(Math.round(x1 + (x2 - x1) * t / n) - 1, Math.round(y1 + (y2 - y1) * t / n) - 1, 2, 2); }
    // scenery in the margins, placed deterministically so every redraw matches
    pts.forEach(([x, y], k) => { const side = k % 2 ? 1 : -1, ox = Math.round(x + side * (36 + (k * 13) % 20)), oy = Math.round(y - 6 + (k * 7) % 10);
      if (ox < 5 || ox > W - 24 || oy < 4 || oy > H - 14) return;
      if (k % 5 === 2) drawRocks(ctx, ox, oy); else if (k % 5 === 0 || k % 5 === 3) drawBush(ctx, ox, oy); });
    if (W > 180) { drawWater(ctx, 6, Math.round(H * .18), 36, 17); drawWater(ctx, W - 48, Math.round(H * .57), 40, 19); drawBush(ctx, 10, Math.round(H * .8)); drawRocks(ctx, W - 30, Math.round(H * .08)); }
    // the castle waits beside the final node
    const last = pts[pts.length - 1];
    if (last) drawCastle(ctx, Math.round(last[0]) - 27, Math.round(last[1]) + 6, nodeSts[nodeSts.length - 1]);
  }, 40);
  setTimeout(() => { const pg = $('#page'); if (pg && wizHolder) { const r = wizHolder.getBoundingClientRect(), pr = pg.getBoundingClientRect(); pg.scrollTop += (r.top - pr.top) - pr.height * 0.4; } }, 60);
}

/* ================================================================ THE GAME LAYER — the guitar book's, carried over (by way of the Push book's split-file
   port) and dressed for Sun and Moon. A chapter on the road is a battle: two hearts; a wrong answer costs one, and losing
   both loses the chapter. Each right answer fills the chapter meter; fill it and the chapter is cleared. Points (◆) come
   from right answers, streaks and cleared chapters, and buy items: Hint and Heal. Reference is free — an open-book chart
   for the question, drawn from the same data the pages use. Turquoise (✦) comes from the recall bonus, as before.
   Also here: Learn mode vs Book mode, soft unlocks (Peek), the Index as a collection, and progress backup. */
const HEARTS = 2;   // lose both and the chapter is lost
const HINT_COST = 50, HEAL_COST = 150, PTS_RIGHT = 15, PTS_STREAK = 5, PTS_STREAK_MAX = 20, PTS_WIN = 60, PTS_FLAWLESS = 40, PTS_START = 100, PTS_TESTOUT = 150, PTS_BONUS = 25, PTS_READING = 60;
const points = () => store.get('course.points', PTS_START);
const addPoints = n => store.set('course.points', Math.max(0, points() + n));
let GAME = null, GAME_GAIN = 0;
const bookMode = () => store.get('mode', 'learn') === 'book';
const setMode = m => { store.set('mode', m); redraw(); };

// a module's test-out: one long battle over every topic in it; win it and the whole module is cleared
function challengeOf(mi) {
  const M = MODULES[mi], topics = M.lessons.filter(l => l.topic && QBANK[l.topic]).map(l => l.topic);
  return {name: `${M.name} · Test out`, mod: mi, modName: M.name, acc: M.acc, challenge: true, topics};
}

/* ---------------- soft unlocks: a room opens when you clear the chapter that teaches it. Peek opens one for the session;
   Book mode opens everything. The key is page:item; the value is the chapter (its QBANK topic). */
const UNLOCKS = {
  'chords:forms': 'forms', 'chords:keys': 'chordsinkey',
  'scales:positions': 'forms',
  'righthand:claw': 'bumditty', 'righthand:ornaments': 'ornaments', 'righthand:licks': 'licks',
  'upneck:forms': 'forms', 'upneck:keys': 'chordsinkey',
};
const PEEK = new Set();
const lessonFor = key => LESSONS.find(l => chapKey(l) === UNLOCKS[key]);
const isOpen = key => bookMode() || !UNLOCKS[key] || !!courseGot()[UNLOCKS[key]] || PEEK.has(key);
const lockMark = key => isOpen(key) ? '' : '🔒 ';
function goLesson(L) { const s = state('course', {}); s.open = LESSONS.indexOf(L); s.challenge = -1; keep('course', s); page(PAGES.findIndex(p => p.id === 'learn')); }
// call where a sealed room would draw: draws the seal and returns true (the caller stops there)
function gate(v, key, label) {
  const L = lessonFor(key);
  if (!L || bookMode() || courseGot()[UNLOCKS[key]]) return false;
  if (PEEK.has(key)) { v.append(h('div', {class: 'peek-bar'}, h('span', {}, `Peeking at ${label} · clear “${L.name}” to open it for good`),
    h('button', {class: 'btn small', on: {click: () => goLesson(L)}}, 'Go to the chapter'))); return false; }
  v.append(h('div', {class: 'seal'},
    h('div', {class: 'seal-lock', 'aria-hidden': 'true'}, h('i'), h('i'), h('i'), h('i')),
    h('h2', {}, `${label} is waiting`),
    h('p', {html: `It opens when you clear <b>${L.name}</b> in <b>${L.modName}</b>.`}),
    h('div', {class: 'seal-btns'},
      h('button', {class: 'btn acc', on: {click: () => goLesson(L)}}, '▶ Take the chapter'),
      h('button', {class: 'btn', on: {click: () => { PEEK.add(key); redraw(); }}}, 'Peek anyway')),
    h('button', {class: 'seal-open', on: {click: () => setMode('book')}}, 'Or switch to Book mode — everything open, no game')));
  return true;
}

/* ---------------- the Index as a collection: a term is "found" when you clear its chapter, visit its page, or open it
   from inside the book. Undiscovered terms still open — they just aren't counted yet. */
const seenTerms = () => store.get('idx.seen', {});
function markSeen(id) { const s = seenTerms(); if (!s[id]) { s[id] = 1; store.set('idx.seen', s); } }
const seenPages = () => store.get('seen.pages', {});
function discovered(id) {
  if (bookMode() || seenTerms()[id]) return true;
  const g = CONCEPT_GOTO[id]; if (!g) return false;
  if (g[0] === 'lesson') return !!courseGot()[g[1]];
  if (g[0] === 'page') return !!seenPages()[g[1]];
  return false;
}
function whereFound(id) {
  const g = CONCEPT_GOTO[id]; if (!g) return 'tap it anywhere in the book';
  if (g[0] === 'lesson') { const L = LESSONS.find(l => l.topic === g[1]); return L ? `clear “${L.name}”` : 'keep learning'; }
  if (g[0] === 'page') { const P = PAGES.find(p => p.id === g[1]); return P ? `visit ${P.name}` : 'keep exploring'; }
  return 'keep learning';
}

/* ---------------- backing up progress: every bj.* key, as a file to save or a code to copy */
const BOOK_ID = 'banjo-mastery';
function progressBlob() { const o = {}; for (let k = 0; k < localStorage.length; k++) { const key = localStorage.key(k); if (key && key.startsWith('bj.')) o[key] = localStorage.getItem(key); }
  return {book: BOOK_ID, saved: new Date().toISOString(), keys: o}; }
const toCode = obj => btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
const fromCode = s => JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
function restoreProgress(obj) {
  if (!obj || obj.book !== BOOK_ID || typeof obj.keys !== 'object') throw new Error('not a Banjo Mastery backup');
  Object.keys(localStorage).filter(k => k.startsWith('bj.')).forEach(k => localStorage.removeItem(k));
  Object.entries(obj.keys).forEach(([k, val]) => { if (k.startsWith('bj.')) localStorage.setItem(k, val); });
}
function backupPanel() {
  const close = () => wrap.remove();
  const msg = h('div', {class: 'muted', style: 'min-height:1.3em;font-weight:700'});
  const area = h('textarea', {rows: 3, placeholder: 'Paste a backup code here to restore it', style: 'width:100%;font:13px/1.3 ui-monospace,monospace;border-radius:8px;padding:8px;border:1.5px solid var(--rule);background:var(--bg);color:var(--ink)'});
  const file = h('input', {type: 'file', accept: '.json,application/json', style: 'display:none', on: {change: e => { const f = e.target.files[0]; if (!f) return;
    f.text().then(t => ask(JSON.parse(t))).catch(() => msg.textContent = 'That file is not a Banjo Mastery backup.'); }}});
  let pending = null;
  const confirmRow = h('div', {style: 'display:none;gap:10px;align-items:center;flex-wrap:wrap'});
  function ask(obj) { if (!obj || obj.book !== BOOK_ID) { msg.textContent = 'That is not a Banjo Mastery backup.'; return; }
    pending = obj; const n = JSON.parse(obj.keys['bj.course.cleared'] || '{}'); msg.textContent = '';
    confirmRow.replaceChildren(h('span', {style: 'font-weight:700'}, `Replace this device’s progress with the backup from ${new Date(obj.saved).toLocaleDateString()} (${Object.keys(n).length} chapters cleared)?`),
      h('button', {class: 'btn acc', on: {click: () => { restoreProgress(pending); location.reload(); }}}, 'Yes, restore it'), h('button', {class: 'btn', on: {click: () => { confirmRow.style.display = 'none'; pending = null; }}}, 'Cancel'));
    confirmRow.style.display = 'flex'; }
  const save = () => { const blob = new Blob([JSON.stringify(progressBlob(), null, 1)], {type: 'application/json'}), a = h('a', {href: URL.createObjectURL(blob), download: `banjo-mastery-progress-${today()}.json`});
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); msg.textContent = 'Saved — keep the file in Files or iCloud Drive.'; };
  const copy = () => { const code = toCode(progressBlob()); (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => msg.textContent = 'Backup code copied — paste it into Notes to keep it.', () => { area.value = code; area.select(); msg.textContent = 'Copy the code from the box below.'; }); };
  const card = h('div', {class: 'cpop-card', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Back up progress', style: 'max-width:520px', on: {click: e => e.stopPropagation()}},
    h('button', {class: 'cpop-x', 'aria-label': 'Close', on: {click: close}}, '×'),
    h('h3', {}, 'Your progress'),
    h('p', {class: 'cpop-short'}, 'Progress lives only on this device. Back it up to keep it safe, or to move it to another one.'),
    h('div', {style: 'display:flex;gap:10px;flex-wrap:wrap;margin:10px 0'}, h('button', {class: 'btn acc', on: {click: save}}, 'Save a backup file'), h('button', {class: 'btn', on: {click: copy}}, 'Copy a backup code')),
    h('div', {style: 'border-top:1px solid var(--rule);margin:12px 0 10px'}),
    h('div', {style: 'display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px'}, h('button', {class: 'btn', on: {click: () => file.click()}}, 'Restore from a file'),
      h('button', {class: 'btn', on: {click: () => { try { ask(fromCode(area.value)); } catch (e) { msg.textContent = 'That code did not read — check it was pasted whole.'; } }}}, 'Restore from the code')),
    area, file, confirmRow, msg);
  const wrap = h('div', {id: 'cpop', on: {click: close}}, card);
  document.body.append(wrap);
}

/* ---------------- the Reference: an open-book chart for the question's topic, free, like an exam legend.

const REF_KIND = {fifthstring: 'neck', tuningq: 'neck', stringsq: 'neck', fretsq: 'neck', names: 'neck', fifthfret: 'neck', landmarks: 'neck', octaves: 'neck', capo: 'capo',

    table(['String', 'Open', 'Tune it from'], [['5th', 'g (' + D.fifthName + ')', `1st string at ${D.fifthStart}`], ['1st', D.openNames[3], '2nd string at 3'], ['2nd', D.openNames[2], '3rd string at 4'], ['3rd', D.openNames[1], '4th string at 5'], ['4th', D.openNames[0], 'the reference']]));
  if (kind === 'capo') body.append(h('div', {class: 'neckwrap'}, capoTable()),
    h('p', {class: 'muted'}, `Capo n plays G shapes n half steps up; the 5th string rises the same n, spiked at fret ${D.fifthStart} + n.`));
  if (kind === 'chords') body.append(h('div', {class: 'cgrid', style: '--n:4;--cw:150px'}, D.chords.filter(c => ['G', 'C', 'D', 'D7', 'Em', 'Am', 'G7', 'C7', 'A', 'E', 'F', 'Dm'].includes(c.name)).map(c => h('div', {class: 'ref-shape', html: bchordSVG(c, {color: QCOL[c.q] || 'var(--rust)'})}))),
    h('p', {class: 'muted'}, 'Major = 1 3 5. Minor lowers the third. A seventh chord adds the ♭7. The 5th string is left off the box: it drones g.'));
  if (kind === 'forms') { const K = 'G'; body.append(h('div', {class: 'cgrid', style: '--n:3;--cw:180px'}, D.forms.map(g => h('div', {class: 'ref-shape', html: bchordSVG(D.formKeys[K][g.form][''], {color: 'var(--teal)'})}))),
    table(['Form', 'Root sits', 'Why'], D.forms.map(g => [g.form, g.rootString === 1 ? 'the 3rd string' : g.form === 'F shape' ? 'the 4th and 1st strings' : 'the 4th string', g.blurb])),
    h('p', {class: 'muted'}, 'No open strings, so the form slides to every key: the fret under the root names the chord. Vamp: pinch on 2 and 4, mute at once.')); }
  if (kind === 'keys') body.append(table(['Key', 'Signature', 'Relative minor', 'Chords in the key'], D.cof.map(([k, sig, m]) => [k, sig, m, (D.chordsInKey[k] ? D.chordsInKey[k].rows.map(r => `${r.roman} ${r.name}`).join(' · ') : '')])),
    h('p', {class: 'muted'}, 'Around the circle each key gains one sharp (clockwise) or one flat (anticlockwise). I, IV and V are major; ii, iii and vi minor; vii° diminished.'));
  if (kind === 'scales') body.append(table(['Scale', 'Degrees', 'From G'], D.scales.map(s => [s.name, s.degrees.join(' '), s.steps.map(x => SH[(x + 7) % 12]).join(' ')])),
    h('p', {class: 'muted'}, 'G major in first position: 3rd string open and 2, 2nd open and 1, 1st open 2 4 5. Styles: Scruggs rolls, melodic (Keith) scales across strings, single-string runs on one string.'));
  if (kind === 'rolls') body.append(table(['Roll', 'Fingers', 'Strings'], D.rolls.map(r => [r.name, r.fingers.join(' '), r.strings.join(' ')])),

function patternPlayer(p, shape, {onStep = () => {}} = {}) {

/* ---------------------------------------------------------------- drawings */
// a chord box: the four long strings, five frets, the nut or a base-fret number, finger numbers, note names below; the 5th string's g noted at the side

  for (let j = 0; j <= 5; j++) o.push(`<line x1="${L - 3}" y1="${T + j * dy}" x2="${L + dx * 3 + 3}" y2="${T + j * dy}" stroke="var(--wire)" stroke-width="1.4"/>`);
  if (base === 1) o.push(`<rect x="${L - 4}" y="${T - 5}" width="${dx * 3 + 8}" height="6" fill="var(--ink)"/>`);
  else o.push(`<text x="${L - 10}" y="${T + dy / 2 + 5}" font-size="13" font-weight="800" text-anchor="end" fill="var(--ink)">${base}</text>`);
  // the 5th string: a short line at the left that starts at fret 5, open, with its g
  const y5 = T + Math.max(0, Math.min(5, 5 - base + 1)) * dy;

  o.push(`<text x="${L - 16}" y="${T + dy * 5 + 18}" font-size="10.5" font-weight="${sh.fifthIn ? 800 : 500}" text-anchor="middle" fill="${sh.fifthIn ? color : 'var(--mute)'}">g</text>`);

    o.push(`<rect x="${L + a * dx - 10}" y="${y - 10}" width="${(b - a) * dx + 20}" height="20" rx="10" fill="${color}"/><text x="${L + (a + b) / 2 * dx}" y="${y + 5}" font-size="12" font-weight="800" text-anchor="middle" fill="var(--onacc)">1</text>`); }
  fr.forEach((f, s) => { const x = L + s * dx;
    if (f < 0) o.push(`<text x="${x}" y="${T - 10}" font-size="14" text-anchor="middle" fill="var(--bad)" font-weight="700">×</text>`);
    else if (f === 0) o.push(`<circle cx="${x}" cy="${T - 13}" r="5.2" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`);

    if (f >= 0) { const pc = (OPENM[s] + f) % 12, root = pc === sh.root;
      o.push(`<text x="${x}" y="${T + dy * 5 + 18}" font-size="11.5" font-weight="${root ? 900 : 500}" text-anchor="middle" fill="${root ? color : 'var(--mute)'}">${sh.notes[s]}</text>`); } });
  return o.join('') + '</svg>';
}

/* ================================================================ SKETCHPAD (page VI): the Song Compass for the banjo
   Your song on the left (sections of chord bars), the compass on the right with the microphone under it.
   Tap a chord on the wheel to put it in the song; or Listen and play: the page hears chords (or single notes),
   names the key they fit, and marks where to go next. The thinking lives in pwa/src/compass/ (PitchEngine,
   ChordFinder, KeyFinder, Suggest: copies of the guitar book's, whose Node tests cover them; spliced in after
   this file by build_book.py). The song is the guitar book's format (store 'song': sections of
   [degree, accidental, quality] tokens) so a song can move between the books. Every chord shape here is one
   the export checked (D.chords, D.chordsInKey, D.formKeys); nothing musical is typed by hand. */
const BOOK = {qualIv: D.qualIv, progs: D.progs, strums: [], finger: [], gallery: []};   // the slice of the data Suggest reads
const SECCOL = {Verse: 'var(--navy)', Chorus: 'var(--gold)', Bridge: 'var(--rust)'};
const defaultSong = () => ({name: 'Untitled song', key: 7, minor: false, bpm: 110, pick: 'forward', sections: {Verse: [], Chorus: [], Bridge: []}, form: [], active: 'Verse', lyrics: ''});
// the quality each degree carries in each mode: when the mode flips the song keeps its degrees and the qualities follow
const DIATONIC = {major: ['', 'm', 'm', '', '', 'm', '°'], minor: ['m', '°', '', 'm', 'm', '', '']};
function convert(t, fromMinor, toMinor) {

  return acc === 0 && q === from[d] ? [d, 0, to[d]] : t;

// a fresh progression for a section, from the library, in the song's mode
function roll(minor) { const pool = D.progs.filter(p => p.minor === minor && p.toks.length <= 8); const p = pool[Math.floor(Math.random() * pool.length)]; return p.toks.map(t => t.slice()); }
const uniqChords = cs => cs.filter((c, i) => cs.findIndex(x => x.root === c.root && x.quality === c.quality) === i);

const CP = {S: null, sel: -1, engine: null, chords: null, notesKey: null, mode: 'chords', heard: null, heardAt: 0, pending: null, pendingAt: 0,
  auto: false, needle: 0, playing: null, lastEnd: null, takeBars: 0, take: null};

const cpChord = t => Suggest.chordOf(cpKey(), t);
const cpName = c => Suggest.describe(cpKey(), c).name;
const cpEl = id => document.getElementById(id);
const cpPick = () => PICK_BY[cpSong().pick] || PICK_BY.forward || D.pick[0];
// a bar in seconds in the chosen pick pattern: its beats at the song's tempo (6/8 counts two dotted-quarter beats, as patternPlayer does)
const cpBeatsPerBar = p => p.beats;

function cpShape(c) {

    if (k.V7.shape.root === c.root && q === '7') return k.V7.shape; }

const cpChordMidi = c => (D.qualIv[c.quality] || D.qualIv['']).map(x => OPENM[0] + ((c.root + x - (OPENM[0] % 12)) % 12 + 12) % 12).sort((a, b) => a - b);

// where you are: the chord being heard (if fresh), else the selected bar, else the section's last bar
function cpFocus() {
  if (CP.heard && performance.now() - CP.heardAt < 4000) return {chord: CP.heard, from: 'heard'};
  const b = cpBars(); if (!b.length) return {chord: null, from: 'none'};
  const i = CP.sel >= 0 && CP.sel < b.length ? CP.sel : b.length - 1;
  return {chord: cpChord(b[i]), from: 'bar', i};

// put a chord in the song: after the selected bar (walking forward), or at the end; 8 bars a section
function cpPlace(c) {

  else if (b.length >= 8) { toast('A section holds 8 bars. Start the next section.'); return; }
  else { const at = CP.sel >= 0 ? CP.sel + 1 : b.length; b.splice(at, 0, tok); CP.sel = at; }

// change the key. keepSound: the same chords, re-read from a new home; otherwise the song moves (I stays I)
function cpSetKey(tonic, minor, keepSound) {

  if (keepSound) { const old = cpKey(), nk = Suggest.keyOf(tonic, minor ? 'minor' : 'major');

  else if (minor !== S.minor) for (const s in S.sections) S.sections[s] = S.sections[s].map(t => convert(t, S.minor, minor));

/* ---------------- your song: sections, bars, form, and where it sits */
function cpRenderSong() {

  const S = cpSong(), k = cpKey(), b = cpBars();
  const tabs = h('div', {class: 'chips'}, Object.keys(S.sections).map(s => h('button', {class: 'chip', 'aria-pressed': s === S.active ? 'true' : 'false',
    style: s === S.active ? `background:${SECCOL[s] || 'var(--ink)'};border-color:${SECCOL[s] || 'var(--ink)'};color:var(--onacc)` : '',
    on: {click: () => { S.active = s; CP.sel = -1; cpSave(); cpAll(); }}}, s + (S.sections[s].length ? ` · ${S.sections[s].length}` : ''))));
  const bars = h('div', {class: 'cp-bars'}, b.map((t, i) => {
    const c = Suggest.describe(k, cpChord(t)), inKey = Suggest.inKey(k, c);
    return h('button', {class: 'cp-bar' + (inKey ? '' : ' out'), 'aria-pressed': i === CP.sel ? 'true' : 'false', 'aria-label': `Bar ${i + 1}: ${c.name}`, 'data-i': i,
      on: {click: e => { if (e.target.classList.contains('cp-x')) { b.splice(i, 1); CP.sel = Math.min(CP.sel, b.length - 1); cpSave(); cpAll(); return; }
        CP.sel = CP.sel === i ? -1 : i; if (CP.sel >= 0) cpPlay(cpChord(t)); cpAll(); }}},
      h('span', {class: 'cn'}, c.name), h('span', {class: 'rn'}, c.roman), i === CP.sel ? h('span', {class: 'cp-x', 'aria-label': `remove bar ${i + 1}`}, '×') : '');
  }), b.length < 8 ? h('div', {class: 'cp-bar empty' + (b.length ? '' : ' first')}, b.length ? '+' : 'tap a chord on the wheel') : '');

  const btnPlay = (which, label) => h('button', {class: 'btn small' + (which === 'section' ? ' acc' : ''), on: {click: () => cpLoop(which)}}, playing(which) ? 'Stop' : label);
  const quiet = (label, fn, title) => h('button', {class: 'btn small quiet', title, on: {click: fn}}, label);
  const tools = h('div', {class: 'cp-tools'}, btnPlay('section', '▶ Play'), btnPlay('song', '▶ Whole song'),
    quiet('Roll', () => { S.sections[S.active] = roll(S.minor); CP.sel = -1; cpSave(); cpAll(); toast('Rolled a new progression'); }, 'a fresh progression for this section'));

    ...Object.keys(S.sections).map(s => chip('+ ' + s, () => { S.form.push(s); cpSave(); cpRenderSong(); })),
    S.form.length ? chip('− last', () => { S.form.pop(); cpSave(); cpRenderSong(); }) : '');

// only speaks when it has something to say: the chords fit another key better than the one that's set
function cpWhere() {

  if (all.length < 3) return null;

  all.forEach(c => { const iv = D.qualIv[c.quality] || D.qualIv['']; iv.forEach(x => kf.add({pitchClass: (c.root + x) % 12, midi: 60, durationMs: 1000 / iv.length})); });
  const r = kf.result();

  return h('div', {class: 'cp-where'}, `These chords sit more naturally in ${r.family.label}.`,
    h('button', {class: 'btn small', on: {click: () => { cpSetKey(r.best.tonic, r.best.mode === 'minor', true); toast(`Now in ${r.best.label}: the same chords, read from a new home`); }}}, `Re-read in ${r.best.label}`));

// loop the section, or play the whole song in its form, in the chosen pattern (a roll, a bum-ditty, the vamp — the book's own strokes), a click on the beats
function cpLoop(which) {
  if (CP.playing) { const was = CP.playing; Seq.stop(); if (was === which) return; }
  const S = cpSong(), order = which === 'song' ? S.form : [S.active], flat = [], where = [];
  order.forEach(sc => (S.sections[sc] || []).forEach((t, i) => { flat.push(cpChord(t)); where.push([sc, i]); }));
  if (!flat.length) { toast('Add some chords first'); return; }

    p.ev.forEach((e, j) => { const at = i * bar + off * b, onBeat = Math.abs(off - Math.round(off)) < 1e-6; off += e.dur;
      ev.push({at, fn: t => { if (onBeat) click(t, Math.round(at / b) % bpb === 0);
          if (sh) bstroke(sh, e, t); else ms.forEach((m, n) => bnote(m, t + n * .012, {gain: e.fin === 'T' ? .3 : .24, kind: e.fin === 'X' ? 'mute' : undefined})); },
        ui: j ? null : () => { const [sc, bi] = where[i]; if (sc !== S.active) { S.active = sc; cpRenderSong(); }

/* ---------------- the compass
   The circle of fifths: majors outside, their relative minors inside. A key's seven chords sit together as
   one lit wedge (IV–I–V outside, ii–vi–iii inside), so distance on the dial is distance in harmony: the
   common next moves (gold) are close, the further-out ones (rust) just past the wedge. */
const CP_COF = [0, 7, 2, 9, 4, 11, 6, 1, 8, 3, 10, 5], CP_R = {out: 212, mid: 158, inn: 110, hub: 104};
const cpPolar = (r, deg) => [220 + r * Math.sin(deg * Math.PI / 180), 220 - r * Math.cos(deg * Math.PI / 180)];
const cpArc = (r, a0, a1) => { const [x0, y0] = cpPolar(r, a0), [x1, y1] = cpPolar(r, a1); return `M${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}`; };
function cpSector(r0, r1, a0, a1) {
  const [x0, y0] = cpPolar(r1, a0), [x1, y1] = cpPolar(r1, a1), [x2, y2] = cpPolar(r0, a1), [x3, y3] = cpPolar(r0, a0);
  return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`;
}
function cpCell(c) {

  const minorish = ['m', 'm7', 'm6', 'm9', '°', 'm7♭5'].includes(c.quality);
  return minorish ? {ring: 'inn', i: CP_COF.indexOf((c.root + 3) % 12), dim: ['°', 'm7♭5'].includes(c.quality)} : {ring: 'out', i: CP_COF.indexOf(c.root)};
}
const cpKeyName = (pc, mode) => KeyFinder.KEYS.find(x => x.tonic === pc && x.mode === mode).name;   // the circle's own spellings
function cpRenderDial() {
  const svg = cpEl('cp-dial'); if (!svg) return;
  const k = cpKey(), f = cpFocus(), cur = f.chord, safe = Suggest.safe(k), mark = {};
  if (cur) {
    Suggest.adventurous(k, cur, {limit: 4}).forEach(x => { const c = cpCell(x); if (c && !c.dim) mark[`${c.ring}:${c.i}`] = 'rust'; });
    Suggest.nextMoves(k, cur, {limit: 4}).forEach(x => { const c = cpCell(x); if (c && !c.dim) mark[`${c.ring}:${c.i}`] = 'gold'; });
  }
  const at = cpCell(cur), o = [`<circle cx="220" cy="220" r="${CP_R.out + 6}" fill="none" stroke="var(--rule)"/>`];
  for (let i = 0; i < 12; i++) {
    const a0 = i * 30 - 15, a1 = i * 30 + 15;
    for (const [ring, r0, r1, chord] of [['out', CP_R.mid, CP_R.out, {root: CP_COF[i], quality: ''}], ['inn', CP_R.inn, CP_R.mid, {root: (CP_COF[i] + 9) % 12, quality: 'm'}]]) {
      const inKey = safe.slice(0, 7).some(x => cpSame(x, chord)), m = mark[`${ring}:${i}`], isCur = at && !at.dim && at.ring === ring && at.i === i;
      // in the key or suggested: spelled by the key, with its numeral; elsewhere the circle's names
      const d = inKey || m ? Suggest.describe(k, chord) : {name: ring === 'out' ? cpKeyName(chord.root, 'major') : cpKeyName(chord.root, 'minor') + 'm', roman: ''};
      const home = chord.root === k.tonic && (k.mode === 'minor') === (ring === 'inn'), [tx, ty] = cpPolar((r0 + r1) / 2, i * 30);
      o.push(`<g class="cp-cell" data-root="${chord.root}" data-q="${chord.quality}" role="button" tabindex="0" aria-label="${d.name}${d.roman ? ', ' + d.roman : ''}${inKey ? ', in the key' : ''}">`
        + `<path d="${cpSector(r0, r1, a0, a1)}" fill="${inKey ? 'var(--cp-wedge)' : 'transparent'}" stroke="${isCur ? 'var(--ink)' : 'var(--rule)'}" stroke-width="${isCur ? 2.6 : 1}"/>`
        + (m ? `<path d="${cpArc(ring === 'out' ? r1 - 3.5 : r0 + 3.5, a0 + 3, a1 - 3)}" fill="none" stroke="var(--${m})" stroke-width="5" stroke-linecap="round"/>` : '')
        + `<text x="${tx}" y="${ty + 2}" text-anchor="middle" font-size="${ring === 'out' ? (d.name.length > 2 ? 17 : 20) : (d.name.length > 3 ? 13 : 15)}" fill="${inKey || isCur ? 'var(--ink)' : 'var(--mute)'}"${home ? ' text-decoration="underline"' : ''} style="font-family:var(--display)">${d.name}</text>`
        + (d.roman ? `<text x="${tx}" y="${ty + (ring === 'out' ? 17 : 14)}" text-anchor="middle" font-size="10" font-weight="700" fill="${inKey ? 'var(--teal)' : 'var(--mute)'}">${d.roman}</text>` : '') + '</g>');
    }
  }
  o.push(`<circle cx="220" cy="220" r="${CP_R.hub}" fill="var(--bg)" stroke="var(--rule)"/>`);
  if (at) {   // a compass bezel: a rust arc on the hub's rim and a point reaching the rings, turning the short way
    const d = ((at.i * 30 - CP.needle) % 360 + 540) % 360 - 180; CP.needle += d;
    o.push(`<g class="cp-needle" style="transform:rotate(${CP.needle}deg)"><path d="${cpArc(CP_R.hub - 4, -16, 16)}" fill="none" stroke="var(--rust)" stroke-width="6" stroke-linecap="round"/><path d="M211 ${220 - CP_R.hub + 1} L220 ${220 - CP_R.inn + 1} L229 ${220 - CP_R.hub + 1}Z" fill="var(--rust)"/></g>`);

// where the chord's notes are on the neck (the four long strings, the 4th at the bottom, and the 5th string above them from fret 5): chord tones big (root in rust), the rest of the key small

  o.push(`<rect x="${X0 + FW - 3}" y="${Y0 - 6}" width="6" height="${(NC - 1) * SHh + 12}" fill="var(--ink)"/>`);
  for (let s = 0; s < NC; s++) o.push(`<line x1="${s === 4 ? X0 + (FIFTH_START + 1) * FW : X0}" x2="${W}" y1="${rowY(s)}" y2="${rowY(s)}" stroke="var(--str)" stroke-width="${s === 4 ? 1 : 1 + (3 - s) * .3}"/>`);
  o.push(`<text x="${X0 + 4}" y="${rowY(4) + 4}" font-size="10" font-weight="700" fill="var(--mute)">5th string · g</text>`);
  for (let fr = 0; fr <= MAXF; fr++) o.push(`<text x="${X0 + (fr + .5) * FW}" y="${Y0 + (NC - 1) * SHh + 26}" text-anchor="middle" font-size="12" fill="var(--mute)">${fr || 'open'}</text>`);

/* ---------------- listening: the needle follows what you play */
function cpRenderLive() {
  const heard = cpEl('cp-heard'); if (!heard) return;
  const on = CP.engine && CP.engine.state === 'listening';
  const lb = cpEl('cp-listen'); lb.classList.toggle('on', on); lb.lastChild.textContent = on ? 'Stop' : 'Listen';
  const fresh = CP.heard && performance.now() - CP.heardAt < 4000;
  if (CP.mode === 'chords' && fresh) { const d = Suggest.describe(cpKey(), CP.heard); heard.textContent = d.name; heard.classList.remove('dim'); cpEl('cp-heardsub').textContent = `${d.roman} in ${cpKey().name} ${cpKey().mode}`; }
  else if (!(CP.mode === 'notes' && on && heard.textContent !== '–')) { heard.textContent = '–'; heard.classList.add('dim'); cpEl('cp-heardsub').textContent = on ? 'listening' : 'not listening'; }
}
// tell the player when the whole banjo is out of tune (the engine has learned it and allows for it)
function cpTuning(cents) {
  const el = cpEl('cp-tune'); if (!el) return;
  const c = Math.round(cents || 0), txt = Math.abs(c) >= 10 ? `Your banjo is about ${Math.abs(c)} cents ${c < 0 ? 'flat' : 'sharp'}; notes are read against its own tuning.` : '';
  if (el.textContent !== txt) el.textContent = txt;
}
// the live meter: loudness on a log scale (0.001 RMS at the left, 0.3 at the right), the gate as a mark,
// green once the mic hears more than the room; in Notes mode the note being played and how many cents off
function cpMeter(v) {
  const m = cpEl('cp-meter'); if (!m) return;
  const lv = r => Math.max(0, Math.min(1, (Math.log10(Math.max(r || 0, 1e-4)) + 3) / 2.5));
  cpEl('cp-lvl').style.width = `${lv(v.rms) * 100}%`;
  cpEl('cp-gate').style.left = v.gate ? `${lv(v.gate) * 100}%` : '0';
  m.classList.toggle('hot', !!v.gate && v.rms >= v.gate);
  const c = cpEl('cp-cents');
  if (v.calibrating) { c.textContent = 'listening to the room…'; c.classList.remove('ok'); return; }
  if (CP.mode === 'notes' && v.note) {
    const cents = Math.round(v.note.cents); c.textContent = `${v.note.name}${v.note.octave} · ${cents === 0 ? 'right on' : Math.abs(cents) + ' cents ' + (cents > 0 ? 'sharp' : 'flat')}`; c.classList.toggle('ok', Math.abs(cents) <= 5);
    const hb = cpEl('cp-heard'); hb.textContent = v.note.name + v.note.octave; hb.classList.remove('dim'); cpEl('cp-heardsub').textContent = `${v.note.freq.toFixed(1)} Hz`;
  } else {
    const t = CP.take, bar = t && t.bars ? (t.startAt ? `bar ${Math.min(t.bars, Math.floor((performance.now() - t.startAt) / t.barMs) + 1)} of ${t.bars} · ` : `play to start the ${t.bars} bars · `) : '';
    c.textContent = v.gate ? bar + (v.rms >= v.gate ? 'hearing you' : 'quiet') : ''; c.classList.remove('ok');
  }
}
/* ---------------- a take: listen for a set number of bars (or until Stop), keep the chords heard in order,

function cpTakeTick(v) {
  const t = CP.take; if (!t || !t.bars) return;
  const now = performance.now();
  if (!t.startAt) { if (!v.calibrating && v.gate != null && v.rms >= v.gate) t.startAt = now; return; }   // the clock starts at the first sound
  if (now - t.startAt >= t.bars * t.barMs) setTimeout(cpStopListen, 0);
}
function cpTakeAdd(e) {
  const t = CP.take; if (!t || e.durationMs < 300) return;                       // a chord shorter than that is a change in progress
  const last = t.chords[t.chords.length - 1];
  if (last && last.root === e.root && last.quality === e.quality) last.ms += e.durationMs; else t.chords.push({root: e.root, quality: e.quality, ms: e.durationMs});
}
function cpTakeReport() {
  const t = CP.take; if (!t) return; CP.take = null;
  const last = t.chords[t.chords.length - 1];                                     // the chord still ringing at the end counts too
  if (CP.heard && performance.now() - CP.heardAt < 4000 && !(last && cpSame(last, CP.heard))) t.chords.push({root: CP.heard.root, quality: CP.heard.quality, ms: 700});
  const m = cpEl('cp-msg'); if (!m || !t.chords.length) return;

  const kf = KeyFinder.create();

  const verdict = !found ? h('span', {}, 'Not enough to tell the key yet: let each chord ring.')

      h('button', {class: 'x', 'aria-label': 'dismiss', title: 'dismiss', on: {click: () => cpMsg('')}}, '×')),

      const b = e.currentTarget; if (b.dataset.key) { const [t, m] = b.dataset.key.split(':'); cpSetKey(+t, m === 'minor', true); toast(`Key set to ${b.textContent.slice(4)}`); return; }
      const c = CP.heard || (CP.lastEnd && {root: CP.lastEnd.root, quality: CP.lastEnd.quality}); if (c) { cpPlace(c); toast(`${cpName(c)} added`); } }}}, 'Add to song'),
      h('label', {class: 'row', style: 'gap:6px;font-weight:700;font-size:14px'}, auto, 'Write what I play')));
  v.append(h('div', {class: 'cp-studio'},
    sec2('Your song', 'tap a bar, then a chord on the wheel', 'var(--rust)', h('div', {id: 'cp-song', class: 'cp-songbox'})),
    h('div', {class: 'cp-dialcol'},
      h('div', {html: `<svg id="cp-dial" class="cp-dial" viewBox="0 0 440 440" role="img" aria-label="The song compass: the circle of fifths with your key lit"></svg>`}),

/* Song Compass — pitch engine (Phase 1).
   Audio and pitch logic only: no DOM, no drawing. The page (compass-ui.js) listens to it.
   Written as a classic script that defines one global, PitchEngine, so Phase 5 can paste it
   straight into pwa/book.template.html the same way build_book.py splices in the app's core.

   Pieces, from the bottom up:
     yin(buf, sampleRate)      one block of samples -> {freq, clarity} or null
     noteOf(freq)              a frequency -> note name, octave, MIDI number, cents off
     createTracker()           frame-by-frame detections -> steady notes + a history of note events
     create()                  wires the microphone to all of the above
   The first three are pure (no browser needed), so they can be tested with fake signals in Node. */
const PitchEngine = (() => {
  'use strict';

  // Spelled the way the book spells them (app.template.html, SH). Phase 2 will re-spell by key.
  const NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];

  const DEFAULTS = {
    minFreq: 70,          // a little under low E (82.4 Hz), so drop-D (73.4 Hz) still reads
    maxFreq: 1400,        // a little over the 24th fret of the high E (1319 Hz)
    threshold: 0.15,      // YIN's dip threshold: lower = stricter, fewer octave mistakes, more misses
    octaveRatio: 0.3,     // double the period wins if it matches about 3x better (see step 3b)
    octaveFloor: 0.004,   // ...unless the first match was already near-perfect. Both tuned on 83 real recordings
    octaveEnergy: 0.0025, // ...and only if the lower note's odd harmonics are really there (power ratio)
    subharmonics: [2, 3], // periods to second-guess: double (octave errors) and triple (twelfth errors)
    twelfthEnergy: 20,    // a triple period needs this many times more in-between energy than an octave (swept
                          // 5–300: 20 fixes a low A read as E4 at almost no cost; 5 adds false notes)
    minClarity: 0.8,      // below this we say "not sure" rather than show a wrong note
    holdFrames: 3,        // a new note must repeat this many frames (~50 ms) before it's shown
    releaseMs: 140,       // silence/uncertainty this long ends the current note
    minNoteMs: 60,        // a note event shorter than this is dropped as a blip
    historySize: 16,
    bufferSize: 4096,     // samples copied from the (filtered) mic each frame, for pitch
    rawSize: 0,           // >0: also tap the UNfiltered mic (8192 for chords) and emit it as 'raw'
    absGate: 0.0015,      // the gate never drops below this loudness (RMS), whatever the room. Was 0.006: a
                          // quiet player lost over half their notes (GuitarSet at 1/4 volume: 41% → 76% found)
    gateRatio: 2,         // ...and otherwise sits this many times above the room's own background
    adaptTuning: false,   // name notes relative to the guitar's own tuning (see createAnalyzer); a tuner
                          // must leave this off, the Song Compass turns it on
    highpass: 180,        // the mic chain's filters (Hz); the tests apply the same ones (test-samples.js).
                          // 180, not 60: body boom and ringing low strings muddy the pitch (GuitarSet
                          // solos 78.6% → 82.1%); low E still reads, from its overtones
    lowpass: 2200,
    context: null,        // optional () => AudioContext, to share the host page's (the book's audio())
    windowSize: 1536,     // samples YIN looks at (the newest ones): low E still fits; swept 1536/2048/3072
    onsetRatio: 2.5,      // a pluck = the newest ~16 ms is this many times louder than just before
    onsetHoldMs: 90,      // a pluck counts for this long (the pitch takes a few frames to come clear)
    minRepeatMs: 90,      // a re-pluck of the same note sooner than this is the same pluck
    a4: 440,
  };

  /* ------------------------------------------------------------------ YIN
     YIN (de Cheveigné & Kawahara, 2002) finds the period of a wave: the time until it repeats.

     Step 1, the difference function. For each candidate lag `tau` (a shift in samples), slide the
     wave against itself and add up the squared gaps:  d(tau) = Σ (x[j] - x[j+tau])².
     If the wave repeats every `tau` samples, the copy lands on top of the original and d(tau) ≈ 0.

     Step 2, normalise. Plain d(tau) also dips at 2×, 3×... the true period (the wave repeats there
     too) and is always 0 at tau = 0. YIN divides each d(tau) by the running average of all the
     d values before it:  d'(tau) = d(tau) · tau / Σ_{k=1..tau} d(k).  Now d' starts at 1, and a
     dip only counts if it is deep compared with everything before it.

     Step 3, the absolute threshold. Take the FIRST lag where d' drops under the threshold (then
     slide to the bottom of that dip). Taking the first, not the deepest, is what stops "octave
     errors": the true period is the earliest good match; 2× the period is a later, equally good one.

     Step 4, parabolic interpolation. The real period rarely falls on a whole sample. Fit a parabola
     through the dip and its two neighbours and take its lowest point: sub-sample accuracy, which is
     what makes the cents reading trustworthy.

     Clarity = 1 - d'(tau): 1 is a perfect repeat, 0 is noise. That is our confidence. */
  function yin(buf, sampleRate, opts = {}) {
    const o = {...DEFAULTS, ...opts};
    const tauMin = Math.max(2, Math.floor(sampleRate / o.maxFreq));
    // the comparison window must hold at least one full period of the lowest note, plus the shift
    const tauMax = Math.min(Math.ceil(sampleRate / o.minFreq), Math.floor(buf.length / 2));
    const W = buf.length - tauMax;                       // how many samples each comparison sums over
    if (tauMax <= tauMin + 2 || W < tauMax) return null;

    // Step 1 + 2 together: difference function, then cumulative-mean normalisation
    const dp = new Float32Array(tauMax + 1);
    dp[0] = 1;
    let running = 0;
    for (let tau = 1; tau <= tauMax; tau++) {
      let sum = 0;
      for (let j = 0; j < W; j++) { const g = buf[j] - buf[j + tau]; sum += g * g; }
      running += sum;
      dp[tau] = running > 0 ? sum * tau / running : 1;
    }

    // Step 3: first dip under the threshold (inside the guitar's range), walked to its bottom
    let tau = -1;
    for (let t = tauMin; t < tauMax; t++) {
      if (dp[t] < o.threshold) {
        while (t + 1 < tauMax && dp[t + 1] < dp[t]) t++;
        tau = t; break;
      }
    }
    if (tau < 0) {
      // nothing cleared the bar: fall back to the deepest dip, and let its low clarity say "unsure"
      let best = tauMin;
      for (let t = tauMin + 1; t < tauMax; t++) if (dp[t] < dp[best]) best = t;
      tau = best;
    }
    if (tau <= tauMin || tau >= tauMax) return null;    // a dip at the edge of the range isn't a real pitch

    // Step 3b, the octave check (added after testing real recordings). As a plucked string rings,
    // its fundamental fades faster than its 2nd harmonic, so the wave comes to ALMOST repeat every
    // half period and step 3 lands an octave too high. A true period shows an even better match
    // at double the lag; a real note's double lag is only ever about as good, never much better.
    // Dips are compared at their parabola-refined bottoms (step 4's trick): at high notes a period of
    // 33.4 samples looks worse at 33 than its double does at 67, just from where the samples fall.
    const refine = t => {
      const a = dp[t - 1], b = dp[t], c = dp[t + 1], den = a - 2 * b + c;
      if (!(den > 0)) return {at: t, depth: b};
      const s = Math.max(-0.5, Math.min(0.5, (a - c) / (2 * den)));
      return {at: t + s, depth: Math.max(0, b - (a - c) * s / 4)};
    };
    // The same test for a period three times as long (the "twelfth" error: a low A whose fundamental
    // and 2nd harmonic are faint reads as the E above, its 3rd harmonic). For k = 3 the lower note's
    // tell-tale harmonics sit at 1/3, 2/3, 4/3 and 5/3 of the higher reading.
    for (let guard = 0; guard < 3; guard++) {
      let moved = false;
      for (const k of o.subharmonics) {
        const tk = tau * k;
        if (tk + 2 >= tauMax) continue;
        let bk = tk;
        for (let t = tk - 2; t <= tk + 2; t++) if (dp[t] < dp[bk]) bk = t;   // the dip may sit a sample off
        const one = refine(tau), lower = refine(bk);
        // only second-guess a so-so match: when the first dip is already near-perfect (clean high
        // notes), both numbers are tiny and their ratio is just noise
        if (!(one.depth > o.octaveFloor && lower.depth < one.depth * o.octaveRatio)) continue;
        // Last word goes to the spectrum: if the note really is lower, there must be actual sound at its
        // harmonics that aren't also harmonics of the higher reading (for an octave: ½, 1½, 2½ of it).
        // If there's next to nothing there, the lower note is a phantom of the maths. (Measured on the
        // recordings: every wrong halving had under 0.3% of such energy; nearly all right ones had more.)
        const fh = sampleRate / one.at;
        let odd = 0;
        for (let j = 1; j < 3 * k; j++) if (j % k) odd += power(buf, sampleRate, fh * j / k);
        const even = power(buf, sampleRate, fh) + power(buf, sampleRate, fh * 2);
        if (odd > even * o.octaveEnergy * (k === 2 ? 1 : o.twelfthEnergy)) { tau = bk; moved = true; break; }
      }
      if (!moved) break;
    }

    // Step 4: parabola through (tau-1, tau, tau+1); its vertex is the refined period
    const a = dp[tau - 1], b = dp[tau], c = dp[tau + 1], den = a - 2 * b + c;
    const shift = den > 0 ? (a - c) / (2 * den) : 0;    // always within ±0.5 of a sample
    const period = tau + Math.max(-0.5, Math.min(0.5, shift));
    const freq = sampleRate / period;
    if (freq < o.minFreq || freq > o.maxFreq) return null;
    return {freq, clarity: Math.max(0, Math.min(1, 1 - b))};
  }

  /* The Goertzel algorithm: how much of ONE frequency is in a block of sound. It's a single bin of a
     Fourier transform (FFT), so it's far cheaper than a whole FFT when you only need to ask about a
     few frequencies. The Hann window fades the block's edges so the cut-off ends don't smear energy. */
  function power(buf, sampleRate, f) {
    const N = buf.length, c = 2 * Math.cos(2 * Math.PI * f / sampleRate);
    let s1 = 0, s2 = 0;
    for (let i = 0; i < N; i++) {
      const s = buf[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1))) + c * s1 - s2;
      s2 = s1; s1 = s;
    }
    return s1 * s1 + s2 * s2 - c * s1 * s2;
  }

  /* ------------------------------------------------------------------ frequency -> note
     MIDI numbers count semitones (frets): A4 = 440 Hz = 69, and each semitone up multiplies the
     frequency by 2^(1/12). So the semitone count is 12 · log2(f / 440) above 69. Rounding gives the
     nearest note; what's left over, times 100, is the cents (a semitone = 100 cents). */
  function noteOf(freq, a4 = DEFAULTS.a4) {
    const exact = 69 + 12 * Math.log2(freq / a4);
    const midi = Math.round(exact);
    const pitchClass = ((midi % 12) + 12) % 12;          // 0 = C ... 11 = B, octave thrown away
    return {
      midi, pitchClass, name: NAMES[pitchClass],
      octave: Math.floor(midi / 12) - 1,                 // MIDI 60 = C4 (middle C), so octave = midi/12 - 1
      cents: (exact - midi) * 100,                       // -50 .. +50
      freq,
    };
  }

  /* RMS (root mean square): square every sample, average, square-root. A fair "how loud" that
     doesn't cancel out just because a wave swings both above and below zero. */
  function rmsOf(buf) {
    let s = 0;
    for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    return Math.sqrt(s / buf.length);
  }

  const median = xs => { const s = [...xs].sort((p, q) => p - q), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

  /* ------------------------------------------------------------------ the tracker
     Turns a jittery stream of per-frame guesses into (a) one steady "current note" for the display
     and (b) a clean history of note EVENTS for Phase 2's key finder.
     It never touches the mic, so tests can feed it fake frames with fake timestamps.

     A history event looks like:
       { id, midi, pitchClass, name, octave, freq, cents, confidence, startedAt, durationMs, ended }
     durationMs matters: the Krumhansl key method weighs each pitch by how long it sounded. */
  function createTracker(opts = {}) {
    const o = {...DEFAULTS, ...opts};
    let candidate = null, candidateCount = 0;    // the note we're auditioning before showing it
    let current = null;                          // the note being shown (null = nothing confident)
    let lastGood = 0;                            // time of the last confident frame for `current`
    let recent = [];                             // the last few frequencies of `current`, for a median
    let event = null;                            // the history event being held right now
    let nextId = 1, lastOnset = -1e9, onsetUsed = -1e9, repluck = null;   // repluck: a same-pitch pluck being confirmed
    let votes = {};                              // frames heard per octave of the current note
    const history = [];
    const listeners = {note: [], noteend: []};
    const emit = (k, v) => listeners[k].forEach(f => f(v));

    function closeEvent(now) {
      if (!event) return;
      event.durationMs = Math.max(0, now - event.startedAt);   // `now` is the last frame that really heard it
      event.ended = true;
      const ev = event; event = null;
      if (ev.durationMs < o.minNoteMs) {         // a blip: forget it was ever logged
        const i = history.indexOf(ev); if (i >= 0) history.splice(i, 1);
        return;
      }
      emit('noteend', ev);
    }
    function openEvent(n, now, confidence) {
      closeEvent(now);
      event = {id: nextId++, midi: n.midi, pitchClass: n.pitchClass, name: n.name, octave: n.octave,
        freq: n.freq, cents: n.cents, confidence, startedAt: now, durationMs: 0, ended: false};
      history.push(event);
      while (history.length > o.historySize) history.shift();
      emit('note', event);
    }

    /* Feed one analysis frame.  det = yin()'s result or null; rms = loudness; gated = too quiet;
       onset = the onset detector heard a fresh pluck this frame. Returns what to show right now. */
    function push(det, rms, now, gated, onset = false) {
      const ok = !gated && det && det.clarity >= o.minClarity;
      const n = ok ? noteOf(det.freq, o.a4) : null;
      // a pluck heard recently (the pitch can take a frame or two to come clear after it)
      if (onset) lastOnset = now;
      const attack = now - lastOnset < o.onsetHoldMs;

      if (n) {
        // A string can't leap a whole octave on its own. An exact octave (or two) away from the
        // ringing note, with no fresh pluck, is the detector slipping on a harmonic: same note.
        // Which octave it IS gets decided by majority over the note's life, not by its first few
        // frames (the pick's attack is the noisiest moment, and it once locked F♯4 in as F♯3).
        if (current && n.midi !== current.midi && (n.midi - current.midi) % 12 === 0 && !attack) {
          lastGood = now; candidate = null; candidateCount = 0;
          votes[n.midi] = (votes[n.midi] || 0) + 1;
          if (votes[n.midi] > (votes[current.midi] || 0)) {        // the other octave has won: relabel
            current = n; recent = [det.freq];
            if (event) Object.assign(event, {midi: n.midi, name: n.name, octave: n.octave, freq: n.freq, cents: n.cents});
          } else {
            if (event) event.durationMs = now - event.startedAt;
            return {note: noteOf(median(recent), o.a4), confidence: det.clarity};
          }
        }
        if (current && n.midi === current.midi) {
          votes[n.midi] = (votes[n.midi] || 0) + 1;
          lastGood = now; candidate = null; candidateCount = 0;
          recent.push(det.freq); if (recent.length > 7) recent.shift();
          // Re-plucking the same note: same pitch, but a fresh onset starts a new event (A, A = two
          // notes). Only once the pitch has STAYED the same for holdFrames after the pluck, though: when
          // you move to a new note, the window still holds the old one for a frame or two.
          if (attack && lastOnset > onsetUsed && event && lastOnset - event.startedAt > o.minRepeatMs) {
            if (!repluck || repluck.at !== lastOnset) repluck = {at: lastOnset, count: 0};
            if (++repluck.count >= o.holdFrames) { onsetUsed = lastOnset; repluck = null; openEvent(current, lastOnset, det.clarity); }
          }
        } else {
          // a different note: it has to show up `holdFrames` times in a row before we switch to it
          repluck = null;
          if (candidate && candidate.midi === n.midi) candidateCount++;
          else { candidate = n; candidateCount = 1; }
          if (candidateCount >= o.holdFrames) {
            current = n; recent = [det.freq]; lastGood = now; candidate = null; candidateCount = 0;
            votes = {[n.midi]: o.holdFrames}; repluck = null;
            if (attack) onsetUsed = lastOnset;               // this pluck is spent on this note
            openEvent(n, now, det.clarity);
          }
        }
      }
      // nothing confident for long enough: the note has ended
      if (current && now - lastGood > o.releaseMs) {
        closeEvent(lastGood);
        current = null; recent = [];
      }

      if (!current) return {note: null, confidence: ok ? det.clarity : (det ? det.clarity : 0)};
      // the display uses the median of recent frames: one bad frame can't yank the needle
      const shown = noteOf(median(recent), o.a4);
      // only frames that actually hear the note lengthen it: the release wait isn't playing time
      if (event && ok && n.midi === event.midi) {
        event.durationMs = now - event.startedAt;
        event.freq = shown.freq; event.cents = shown.cents;     // a running best estimate of its pitch
        event.confidence = Math.max(event.confidence, det.clarity);
      }
      return {note: shown, confidence: ok ? det.clarity : 0};
    }

    return {
      push,
      setA4(a4) { o.a4 = a4; },                 // the reference pitch notes are named against (see adaptTuning)
      flush(now) { closeEvent(now); current = null; candidate = null; recent = []; },
      on(k, f) { listeners[k].push(f); return () => { listeners[k] = listeners[k].filter(g => g !== f); }; },
      get history() { return history.map(e => ({...e})); },   // copies, so nobody edits ours by accident
      clear() { history.length = 0; event = null; },
    };
  }

  /* ------------------------------------------------------------------ one frame at a time
     createAnalyzer does everything that happens to one block of samples: noise gate, onset detector,
     YIN, tracker. The live mic loop and the tests both feed it, so the tests measure the live code.
     process(buf, now): buf = the newest samples (the AnalyserNode's 4096), now = time in ms. */
  function createAnalyzer(sampleRate, opts = {}) {
    const o = {...DEFAULTS, ...opts};
    const tracker = createTracker(o);
    const tail = Math.round(sampleRate * 0.016);       // ~16 ms: about one frame's worth of new sound
    let startedAt = null, noiseFloor = Infinity, tails = [];

    /* Noise gate. For the first ~0.6 s we measure the room: the QUIETEST moment, not the average, so
       pressing Start mid-strum doesn't teach it that the guitar is background noise (capped too).
       Then the gate is 3x that level, never below an absolute floor, and keeps re-learning slowly
       while it's quiet so a noisier room doesn't make it fire on the fridge. */
    const CALIBRATE_MS = 600, MAX_FLOOR = 0.01;
    function gateFor(rms, now) {
      if (startedAt == null) startedAt = now;
      if (now - startedAt < CALIBRATE_MS) { noiseFloor = Math.min(noiseFloor, rms, MAX_FLOOR); return Infinity; }
      if (!isFinite(noiseFloor)) noiseFloor = 0;
      const gate = Math.max(o.absGate, noiseFloor * o.gateRatio);
      if (rms < gate) noiseFloor = Math.min(MAX_FLOOR, noiseFloor * 0.995 + rms * 0.005);
      return gate;
    }

    /* Onset detector. A pick or finger hitting a string is a sudden burst of energy. Each frame we
       measure only the newest ~16 ms (the rest of the buffer is old news) and flag an onset when it's
       onsetRatio times louder than the quietest of the last few frames, and still rising. This catches
       a re-plucked note, which pitch alone can't (A then A has no pitch change). */
    function onsetIn(buf, gate) {
      let e = 0; for (let i = buf.length - tail; i < buf.length; i++) e += buf[i] * buf[i];
      e /= tail;
      const before = tails.length >= 3 ? Math.min(...tails.slice(-3)) : Infinity, prev = tails[tails.length - 1];
      tails.push(e); if (tails.length > 6) tails.shift();
      return isFinite(gate) && Math.sqrt(e) > gate && e > before * o.onsetRatio && e > prev * 1.2;
    }

    /* The guitar's own tuning. Amateur guitars are often a little sharp or flat all over, and a note 25
       cents flat sits halfway to the next one down, so vibrato tips it into the wrong name (GuitarSet
       detuned 25 cents: notes found fell from 79% to 42%). So we keep a running average of how far
       steady, confident notes sit from A = 440, and name notes against that. Cents wrap round (+49 and
       −49 are neighbours), so the average is circular: each offset is a point on a circle, and the
       direction of their mean is the offset. Applied once there's enough evidence and it's more than
       10 cents off. The offset is reported, so a page can say "your guitar is about 25 cents flat". */
    let tx = 0, ty = 0, tN = 0, tuning = 0;
    function learnTuning(det) {
      const c = 1200 * Math.log2(det.freq / 440), a = 2 * Math.PI * c / 100;
      tx = tx * 0.98 + Math.cos(a) * 0.02; ty = ty * 0.98 + Math.sin(a) * 0.02; tN++;
      const r = Math.hypot(tx, ty) / (1 - Math.pow(0.98, tN)), off = Math.atan2(ty, tx) * 100 / (2 * Math.PI);
      tuning = tN >= 40 && r > 0.6 && Math.abs(off) >= 10 ? off : (Math.abs(off) < 6 ? 0 : tuning);
      tracker.setA4(440 * Math.pow(2, tuning / 1200));
    }

    function process(buf, now) {
      const win = buf.length > o.windowSize ? buf.subarray(buf.length - o.windowSize) : buf;
      const rms = rmsOf(win), gate = gateFor(rms, now), gated = rms < gate;
      const onset = onsetIn(buf, gate);
      const det = gated ? null : yin(win, sampleRate, o);         // skip the maths when it's quiet
      if (o.adaptTuning && det && det.clarity >= 0.9) learnTuning(det);
      const view = tracker.push(det, rms, now, gated, onset);
      return {...view, rms, onset, gate: isFinite(gate) ? gate : null, calibrating: !isFinite(gate), raw: det, sampleRate,
        tuning, a4: 440 * Math.pow(2, tuning / 1200)};
    }
    return {process, tracker, flush: now => tracker.flush(now)};
  }

  /* ------------------------------------------------------------------ the microphone
     Signal path:  mic -> high-pass 60 Hz -> low-pass 2.2 kHz -> AnalyserNode
     The high-pass removes rumble (desk bumps, AC hum's lowest part) below the guitar's range; the
     low-pass trims the bright upper harmonics that make the wave messier without changing its pitch.
     The AnalyserNode is a tap: every animation frame (~60 a second) we copy out its newest 4096
     samples and hand them to createAnalyzer (which uses the newest 2048 for pitch). */
  function create(opts = {}) {
    const o = {...DEFAULTS, ...opts};
    const listeners = {frame: [], state: [], note: [], noteend: [], raw: []};
    const emit = (k, v) => listeners[k].forEach(f => f(v));
    let ctx = null, stream = null, nodes = [], raf = 0, buf = null, analyser = null, an = null, rawAnalyser = null, rawBuf = null;
    let state = 'idle', kept = [];                      // kept: finished notes, carried across Stop/Start

    const setState = (s, detail) => { state = s; emit('state', {state: s, detail}); };

    function loop() {
      analyser.getFloatTimeDomainData(buf);
      const view = an.process(buf, performance.now());
      emit('frame', view);

  bumditty: [
    Q('Bum-ditty is:', 'one string on the beat, a brush across the top, the thumb on the 5th — a quarter and two eighths', ['three brushes', 'a roll', 'a hammer-on and a pull-off'], 'Say it out loud.', `${CLAW_BY.bumditty.blurb}. Count ${CLAW_BY.bumditty.count.join(' ')}.`),

    Q('The three chords most tunes use are the three touching keys on the circle because:', 'a key’s V is one step clockwise and its IV one step back', ['they are the loudest', 'they share a key signature', 'they are all minor'], 'Neighbours.', 'C–G–D on the circle: C is the IV of G and D is the V. Every key’s three chords are its two neighbours and itself.'),

  pentatonic: [
    Q('The major pentatonic is the major scale without:', 'degrees 4 and 7', ['degrees 2 and 6', 'degrees 1 and 5', 'degrees 3 and 5'], 'Five notes left.', 'Drop the 4 and the 7 and nothing clashes with the chord: 1 2 3 5 6. The shape of most Scruggs fills and all of Cumberland Gap.'),

  blues: [

    Q('A mode is:', 'the major scale started on a different note — same notes, different home', ['a tuning', 'a chord shape', 'a kind of roll'], 'Same notes.', 'Start the C scale on G and you have G Mixolydian; start it on D and you have D Dorian. Old-time tunes use these two constantly.'),

  melodic: [
    Q('The melodic (Keith) style’s idea is:', 'arrange the rolls so consecutive scale notes fall on different strings, and play a fiddle tune note for note', ['play one string with thumb and index', 'strike down with a nail', 'play only chord tones'], 'Scales across strings.', `${D.styles[2].blurb}`),

    Q('Cut time (2/2) means:', 'two half-note beats to a bar — the bluegrass feel', ['two quarter-note beats', 'half the tempo', 'two bars of two'], 'Two big beats.', 'The same notes as 4/4 but felt in two, with the vamp on the “and” of each big beat. Written 2/2, it goes twice as fast as it reads.'),
